
name: Notificacoes Cade Meu Pet


on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: read

concurrency:
  group: cade-meu-pet-notificacoes
  cancel-in-progress: false

jobs:
  enviar-alertas:
    name: Verificar animais e enviar alertas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar bibliotecas
        run: |
          npm install --no-save --no-package-lock firebase-admin@13.10.0 web-push@3.6.7

      - name: Enviar notificacoes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
        run: node scripts/enviar-alertas.cjs
