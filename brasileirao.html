<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Tabela & Simulador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(51, 65, 85, 0.6);
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-cyan: #06b6d4;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 60%);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }

    header {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #030712;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }

    .brand-info h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .brand-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .player-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #020617;
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 12px;
    }

    .player-box span {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    audio {
      height: 30px;
      width: 180px;
      outline: none;
    }

    .layout {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .tools-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      background: #020617;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      outline: none;
      width: 220px;
      transition: all 0.2s ease;
    }

    .search-box:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th {
      color: var(--text-muted);
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    th.left, td.left { text-align: left; }

    td {
      padding: 11px 8px;
      text-align: center;
      border-bottom: 1px solid rgba(51, 65, 85, 0.3);
      font-weight: 500;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    tr.g4 td:first-child {
      border-left: 4px solid var(--accent-green);
      color: var(--accent-green);
      font-weight: 800;
    }

    tr.g6 td:first-child {
      border-left: 4px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 800;
    }

    tr.z4 td:first-child {
      border-left: 4px solid var(--accent-rose);
      color: var(--accent-rose);
      font-weight: 800;
    }

    .pts {
      font-weight: 800;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      border-radius: 6px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .panel-title h2 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
    }

    .panel-title p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .round-select {
      background: #020617;
      color: var(--accent-green);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .round-select:hover {
      border-color: var(--accent-green);
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: #020617;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(30, 41, 59, 0.9);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .match-item {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }

    .match-item:hover {
      border-color: rgba(148, 163, 184, 0.4);
    }

    .match-date {
      font-size: 0.65rem;
      color: var(--accent-green);
      text-align: center;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .match-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .team-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-inputs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .score-inputs input {
      width: 32px;
      height: 30px;
      background: #020617;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--accent-green);
      text-align: center;
      font-weight: 800;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .score-inputs input:focus {
      border-color: var(--accent-green);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .btn-confirm {
      background: var(--accent-green);
      color: #030712;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-confirm:hover {
      background: var(--accent-green-hover);
      color: #fff;
    }

    .btn-reset {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .btn-reset:hover {
      color: #fff;
      background: rgba(51, 65, 85, 0.8);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">⚽</div>
      <div class="brand-info">
        <h1>BRASILEIRÃO <span class="badge">SÉRIE A</span></h1>
        <p>Classificação Oficial, Agenda & Simulador</p>
      </div>
    </div>

    <div class="player-box">
      <span>♫ Tema Oficial</span>
      <audio id="audio-fundo" src="musica-brasileirao.mp3" controls loop preload="auto"></audio>
    </div>
  </header>

  <div class="layout">
    
    <!-- Left Column: Table -->
    <div class="card">
      <div class="tools-bar">
        <input type="text" id="search-input" class="search-box" onkeyup="filterTable()" placeholder="Buscar time...">
        <div class="legend">
          <div class="legend-item"><div class="dot" style="background: var(--accent-green)"></div> G4 Libertadores</div>
          <div class="legend-item"><div class="dot" style="background: var(--accent-cyan)"></div> G6 Pré-Lib.</div>
          <div class="legend-item"><div class="dot" style="background: var(--accent-rose)"></div> Z4 Rebaixamento</div>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Clube</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- JS populated -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Right Column: Sidebar -->
    <div class="card">
      <div class="panel-header">
        <div class="panel-title">
          <h2 id="panel-title">Próximos Jogos</h2>
          <p id="panel-subtitle">Agenda Oficial da Série A</p>
        </div>
        <select id="round-select" class="round-select" onchange="renderMatches()">
          <option value="29">Rodada 29</option>
          <option value="30">Rodada 30</option>
        </select>
      </div>

      <div class="tabs">
        <button id="tab-agenda" class="tab-btn active" onclick="switchTab('agenda')">📅 Agenda</button>
        <button id="tab-sim" class="tab-btn" onclick="switchTab('simulador')">⚡ Simulador</button>
      </div>

      <div id="matches-list" class="matches-list">
        <!-- JS populated -->
      </div>

      <div id="sim-actions" class="btn-group" style="display: none;">
        <button class="btn btn-confirm" onclick="confirmSimulation()">Confirmar Placares</button>
        <button class="btn btn-reset" onclick="resetSimulation()">Resetar</button>
      </div>
    </div>

  </div>

  <script>
    // Autoplay fallback: plays audio on user's first click anywhere on the document
    document.addEventListener('click', function() {
      const audio = document.getElementById('audio-fundo');
      if (audio && audio.paused) {
        audio.play().catch(() => {});
      }
    }, { once: true });

    const initialTeams = [
      { name: 'Flamengo', pts: 60, j: 28, v: 18, e: 6, d: 4, gp: 55, gc: 23 },
      { name: 'Palmeiras', pts: 57, j: 28, v: 16, e: 9, d: 3, gp: 47, gc: 21 },
      { name: 'Athletico-PR', pts: 49, j: 28, v: 14, e: 7, d: 7, gp: 43, gc: 32 },
      { name: 'Fluminense', pts: 48, j: 28, v: 13, e: 9, d: 6, gp: 44, gc: 36 },
      { name: 'Bahia', pts: 46, j: 28, v: 12, e: 10, d: 6, gp: 43, gc: 35 },
      { name: 'Cruzeiro', pts: 45, j: 28, v: 13, e: 6, d: 9, gp: 42, gc: 40 },
      { name: 'Atlético-MG', pts: 43, j: 28, v: 12, e: 7, d: 9, gp: 37, gc: 32 },
      { name: 'Santos', pts: 41, j: 28, v: 11, e: 8, d: 9, gp: 43, gc: 41 },
      { name: 'Coritiba', pts: 38, j: 28, v: 10, e: 8, d: 10, gp: 37, gc: 43 },
      { name: 'São Paulo', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Red Bull Bragantino', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Botafogo', pts: 35, j: 28, v: 9, e: 8, d: 11, gp: 41, gc: 45 },
      { name: 'Vitória', pts: 33, j: 28, v: 9, e: 6, d: 13, gp: 28, gc: 42 },
      { name: 'Corinthians', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 29, gc: 32 },
      { name: 'Mirassol', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 33, gc: 42 },
      { name: 'Vasco da Gama', pts: 31, j: 27, v: 8, e: 7, d: 12, gp: 34, gc: 41 },
      { name: 'Grêmio', pts: 29, j: 28, v: 7, e: 8, d: 13, gp: 30, gc: 38 },
      { name: 'Internacional', pts: 28, j: 28, v: 6, e: 10, d: 12, gp: 30, gc: 36 },
      { name: 'Remo', pts: 23, j: 28, v: 5, e: 8, d: 15, gp: 32, gc: 47 },
      { name: 'Chapecoense', pts: 18, j: 27, v: 3, e: 9, d: 15, gp: 29, gc: 53 }
    ];

    const round29 = [
      { id: 1, home: 'Remo', away: 'Grêmio', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 2, home: 'Red Bull Bragantino', away: 'Mirassol', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 3, home: 'Internacional', away: 'Corinthians', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 4, home: 'Vitória', away: 'Chapecoense', date: 'Qua • 07/10 - 20:00', hScore: '', aScore: '' },
      { id: 5, home: 'Botafogo', away: 'Vasco da Gama', date: 'Qua • 07/10 - 20:30', hScore: '', aScore: '' },
      { id: 6, home: 'Cruzeiro', away: 'São Paulo', date: 'Qua • 07/10 - 21:30', hScore: '', aScore: '' },
      { id: 7, home: 'Santos', away: 'Flamengo', date: 'Qui • 08/10 - 19:30', hScore: '', aScore: '' },
      { id: 8, home: 'Athletico-PR', away: 'Atlético-MG', date: 'Qui • 08/10 - 20:00', hScore: '', aScore: '' },
      { id: 9, home: 'Fluminense', away: 'Coritiba', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' },
      { id: 10, home: 'Palmeiras', away: 'Bahia', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' }
    ];

    const round30 = [
      { id: 11, home: 'Vasco da Gama', away: 'Remo', date: 'Sáb • 10/10 - 18:00', hScore: '', aScore: '' },
      { id: 12, home: 'São Paulo', away: 'Vitória', date: 'Sáb • 10/10 - 21:00', hScore: '', aScore: '' },
      { id: 13, home: 'Atlético-MG', away: 'Santos', date: 'Dom • 11/10 - 16:00', hScore: '', aScore: '' },
      { id: 14, home: 'Flamengo', away: 'Fluminense', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 15, home: 'Palmeiras', away: 'Corinthians', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 16, home: 'Grêmio', away: 'Internacional', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 17, home: 'Bahia', away: 'Mirassol', date: 'Dom • 11/10 - 19:30', hScore: '', aScore: '' },
      { id: 18, home: 'Coritiba', away: 'Botafogo', date: 'Seg • 12/10 - 16:00', hScore: '', aScore: '' },
      { id: 19, home: 'Chapecoense', away: 'Athletico-PR', date: 'Seg • 12/10 - 19:30', hScore: '', aScore: '' },
      { id: 20, home: 'Red Bull Bragantino', away: 'Cruzeiro', date: 'Seg • 12/10 - 21:00', hScore: '', aScore: '' }
    ];

    let activeTeams = JSON.parse(JSON.stringify(initialTeams));
    let activeTab = 'agenda';

    function renderTable() {
      // Sort logic: Points > Wins > Goal Difference > Goals For
      activeTeams.sort((a, b) => 
        (b.pts - a.pts) || 
        (b.v - a.v) || 
        ((b.gp - b.gc) - (a.gp - a.gc)) || 
        (b.gp - a.gp)
      );

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      
      activeTeams.forEach((t, index) => {
        const pos = index + 1;
        const sg = t.gp - t.gc;
        let zoneClass = pos <= 4 ? 'g4' : (pos <= 6 ? 'g6' : (pos >= 17 ? 'z4' : ''));

        tbody.innerHTML += `
          <tr class="${zoneClass}">
            <td>${pos}</td>
            <td class="left">${t.name}</td>
            <td class="pts">${t.pts}</td>
            <td>${t.j}</td>
            <td>${t.v}</td>
            <td>${t.e}</td>
            <td>${t.d}</td>
            <td>${t.gp}</td>
            <td>${t.gc}</td>
            <td>${sg > 0 ? '+' + sg : sg}</td>
          </tr>
        `;
      });

      filterTable();
    }

    function filterTable() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#table-body tr');

      rows.forEach(row => {
        const teamName = row.children[1].textContent.toLowerCase();
        row.style.display = teamName.includes(query) ? '' : 'none';
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-agenda').className = tab === 'agenda' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-sim').className = tab === 'simulador' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('sim-actions').style.display = tab === 'simulador' ? 'flex' : 'none';
      document.getElementById('panel-title').textContent = tab === 'agenda' ? 'Próximos Jogos' : 'Simulador';
      document.getElementById('panel-subtitle').textContent = tab === 'agenda' ? 'Agenda Oficial da Série A' : 'Informe os placares abaixo';
      renderMatches();
    }

    function renderMatches() {
      const selectedRound = document.getElementById('round-select').value;
      const games = selectedRound === '29' ? round29 : round30;
      const container = document.getElementById('matches-list');
      container.innerHTML = '';

      games.forEach(g => {
        if (activeTab === 'agenda') {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-body">
                <span class="team-name" style="text-align: right;">${g.home}</span>
                <span style="color: var(--text-muted); font-size: 0.7rem; padding: 0 10px;">VS</span>
                <span class="team-name" style="text-align: left;">${g.away}</span>
              </div>
            </div>`;
        } else {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-body">
                <span class="team-name" style="text-align: right;">${g.home}</span>
                <div class="score-inputs">
                  <input type="number" min="0" max="15" value="${g.hScore}" onchange="updateScore(${g.id}, 'h', this.value)">
                  <span style="color: var(--text-muted); font-size: 0.75rem;">x</span>
                  <input type="number" min="0" max="15" value="${g.aScore}" onchange="updateScore(${g.id}, 'a', this.value)">
                </div>
                <span class="team-name" style="text-align: left;">${g.away}</span>
              </div>
            </div>`;
        }
      });
    }

    function updateScore(id, side, val) {
      const allGames = [...round29, ...round30];
      const game = allGames.find(g => g.id === id);
      if (game) {
        if (side === 'h') game.hScore = val;
        else game.aScore = val;
      }
    }

    function confirmSimulation() {
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      const allGames = [...round29, ...round30];

      allGames.forEach(g => {
        if (g.hScore !== '' && g.aScore !== '') {
          const h = parseInt(g.hScore);
          const a = parseInt(g.aScore);
          const home = activeTeams.find(t => t.name === g.home);
          const away = activeTeams.find(t => t.name === g.away);

          if (home && away) {
            home.j++; away.j++; 
            home.gp += h; home.gc += a; 
            away.gp += a; away.gc += h;

            if (h > a) { 
              home.pts += 3; home.v++; away.d++; 
            } else if (a > h) { 
              away.pts += 3; away.v++; home.d++; 
            } else { 
              home.pts++; away.pts++; home.e++; away.e++; 
            }
          }
        }
      });

      renderTable();
    }

    function resetSimulation() {
      [...round29, ...round30].forEach(g => { g.hScore = ''; g.aScore = ''; });
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      renderMatches();
      renderTable();
    }

    // Initial render
    renderTable();
    renderMatches();
  </script>
</body>
</html>
