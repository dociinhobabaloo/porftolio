<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Tabela & Simulador</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(51, 65, 85, 0.6);
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --g4: #10b981;
      --g6: #06b6d4;
      --z4: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      display: flex; align-items: center; justify-content: center;
      color: #030712; font-weight: 800; font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .brand-info h1 { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .badge { background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.2); font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
    .brand-info p { font-size: 0.75rem; color: var(--text-muted); }

    .player-box {
      display: flex; align-items: center; gap: 8px;
      background: #020617; border: 1px solid var(--card-border);
      padding: 6px 12px; border-radius: 12px;
    }
    .player-box span { font-size: 0.75rem; font-weight: 600; color: var(--accent); }
    audio { height: 28px; width: 170px; }

    /* Main Layout */
    .layout {
      max-width: 1280px; width: 100%; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 360px; gap: 20px; flex: 1;
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);
      display: flex; flex-direction: column;
    }

    /* Top Tools */
    .tools-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .search-box {
      background: #020617; border: 1px solid var(--card-border);
      color: #fff; padding: 8px 12px; border-radius: 10px;
      font-size: 0.8rem; outline: none; width: 220px; transition: all 0.2s;
    }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .legend { display: flex; gap: 12px; font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th {
      color: var(--text-muted); padding: 10px 8px; text-align: center;
      border-bottom: 1px solid var(--card-border); font-size: 0.7rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }
    th.left, td.left { text-align: left; }
    td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(51, 65, 85, 0.3); font-weight: 500; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    tr.g4 td:first-child { border-left: 4px solid var(--g4); color: var(--g4); font-weight: 700; }
    tr.g6 td:first-child { border-left: 4px solid var(--g6); color: var(--g6); font-weight: 700; }
    tr.z4 td:first-child { border-left: 4px solid var(--z4); color: var(--z4); font-weight: 700; }

    .pts { font-weight: 800; color: var(--accent); background: rgba(16, 185, 129, 0.08); border-radius: 6px; }

    /* Sidebar */
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .panel-title h2 { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .panel-title p { font-size: 0.7rem; color: var(--text-muted); }

    .round-select {
      background: #020617; color: var(--accent);
      border: 1px solid var(--card-border); border-radius: 8px;
      padding: 6px 10px; font-size: 0.75rem; font-weight: 700; outline: none; cursor: pointer;
    }

    .tabs { display: flex; gap: 4px; background: #020617; padding: 4px; border-radius: 10px; border: 1px solid var(--card-border); margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 8px; border: none; background: transparent;
      color: var(--text-muted); font-weight: 600; cursor: pointer;
      border-radius: 6px; font-size: 0.75rem; transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(30, 41, 59, 0.8); color: #fff; shadow: 0 1px 3px rgba(0,0,0,0.3); }

    /* Matches */
    .matches-list { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
    .match-item { background: rgba(2, 6, 23, 0.6); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; }
    .match-date { font-size: 0.65rem; color: var(--accent); text-align: center; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    .match-body { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; }
    .team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .score-inputs { display: flex; align-items: center; gap: 4px; }
    .score-inputs input {
      width: 28px; height: 28px; background: #020617;
      border: 1px solid var(--card-border); border-radius: 6px;
      color: var(--accent); text-align: center; font-weight: 800; font-size: 0.8rem; outline: none;
    }

    /* Actions */
    .btn-group { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-border); }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .btn-confirm { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
    .btn-confirm:hover { background: var(--accent-hover); }
    .btn-reset { background: rgba(30, 41, 59, 0.8); color: var(--text-muted); border: 1px solid var(--card-border); }
    .btn-reset:hover { color: #fff; }
  </style>
</head>
<body>

  <!-- Header com Player -->
  <header>
    <div class="brand">
      <div class="brand-logo">⚽</div>
      <div class="brand-info">
        <h1>BRASILEIRÃO <span class="badge">SÉRIE A</span></h1>
        <p>Classificação Oficial, Agenda & Simulador</p>
      </div>
    </div>

    <div class="player-box">
      <span>♫ Tema</span>
      <audio controls>
        <source src="musica-brasileiro.mp3" type="audio/mpeg">
      </audio>
    </div>
  </header>

  <div class="layout">
    
    <!-- Tabela Principal -->
    <div class="card">
      <div class="tools-bar">
        <input type="text" id="search-input" class="search-box" onkeyup="filterTable()" placeholder="Buscar time...">
        <div class="legend">
          <div class="legend-item"><div class="dot" style="background: var(--g4)"></div> G4 Libertadores</div>
          <div class="legend-item"><div class="dot" style="background: var(--g6)"></div> G6 Pré-Lib.</div>
          <div class="legend-item"><div class="dot" style="background: var(--z4)"></div> Z4</div>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Clube</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Gerado por JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Painel Lateral -->
    <div class="card">
      <div class="panel-header">
        <div class="panel-title">
          <h2 id="panel-title">Próximos Jogos</h2>
          <p id="panel-subtitle">Agenda Oficial da Série A</p>
        </div>
        <select id="round-select" class="round-select" onchange="renderMatches()">
          <option value="29">Rodada 29</option>
          <option value="30">Rodada 30</option>
        </select>
      </div>

      <!-- Abas -->
      <div class="tabs">
        <button id="tab-agenda" class="tab-btn active" onclick="switchTab('agenda')">📅 Agenda</button>
        <button id="tab-sim" class="tab-btn" onclick="switchTab('simulador')">⚡ Simulador</button>
      </div>

      <!-- Jogos -->
      <div id="matches-list" class="matches-list">
        <!-- Gerado por JS -->
      </div>

      <!-- Botões do Simulador -->
      <div id="sim-actions" class="btn-group" style="display: none;">
        <button class="btn btn-confirm" onclick="confirmSimulation()">Confirmar</button>
        <button class="btn btn-reset" onclick="resetSimulation()">Resetar</button>
      </div>
    </div>

  </div>

  <script>
    const initialTeams = [
      { name: 'Flamengo', pts: 60, j: 28, v: 18, e: 6, d: 4, gp: 55, gc: 23 },
      { name: 'Palmeiras', pts: 57, j: 28, v: 16, e: 9, d: 3, gp: 47, gc: 21 },
      { name: 'Athletico-PR', pts: 49, j: 28, v: 14, e: 7, d: 7, gp: 43, gc: 32 },
      { name: 'Fluminense', pts: 48, j: 28, v: 13, e: 9, d: 6, gp: 44, gc: 36 },
      { name: 'Bahia', pts: 46, j: 28, v: 12, e: 10, d: 6, gp: 43, gc: 35 },
      { name: 'Cruzeiro', pts: 45, j: 28, v: 13, e: 6, d: 9, gp: 42, gc: 40 },
      { name: 'Atlético-MG', pts: 43, j: 28, v: 12, e: 7, d: 9, gp: 37, gc: 32 },
      { name: 'Santos', pts: 41, j: 28, v: 11, e: 8, d: 9, gp: 43, gc: 41 },
      { name: 'Coritiba', pts: 38, j: 28, v: 10, e: 8, d: 10, gp: 37, gc: 43 },
      { name: 'São Paulo', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Red Bull Bragantino', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Botafogo', pts: 35, j: 28, v: 9, e: 8, d: 11, gp: 41, gc: 45 },
      { name: 'Vitória', pts: 33, j: 28, v: 9, e: 6, d: 13, gp: 28, gc: 42 },
      { name: 'Corinthians', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 29, gc: 32 },
      { name: 'Mirassol', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 33, gc: 42 },
      { name: 'Vasco da Gama', pts: 31, j: 27, v: 8, e: 7, d: 12, gp: 34, gc: 41 },
      { name: 'Grêmio', pts: 29, j: 28, v: 7, e: 8, d: 13, gp: 30, gc: 38 },
      { name: 'Internacional', pts: 28, j: 28, v: 6, e: 10, d: 12, gp: 30, gc: 36 },
      { name: 'Remo', pts: 23, j: 28, v: 5, e: 8, d: 15, gp: 32, gc: 47 },
      { name: 'Chapecoense', pts: 18, j: 27, v: 3, e: 9, d: 15, gp: 29, gc: 53 }
    ];

    const round29 = [
      { id: 1, home: 'Remo', away: 'Grêmio', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 2, home: 'Red Bull Bragantino', away: 'Mirassol', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 3, home: 'Internacional', away: 'Corinthians', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 4, home: 'Vitória', away: 'Chapecoense', date: 'Qua • 07/10 - 20:00', hScore: '', aScore: '' },
      { id: 5, home: 'Botafogo', away: 'Vasco da Gama', date: 'Qua • 07/10 - 20:30', hScore: '', aScore: '' },
      { id: 6, home: 'Cruzeiro', away: 'São Paulo', date: 'Qua • 07/10 - 21:30', hScore: '', aScore: '' },
      { id: 7, home: 'Santos', away: 'Flamengo', date: 'Qui • 08/10 - 19:30', hScore: '', aScore: '' },
      { id: 8, home: 'Athletico-PR', away: 'Atlético-MG', date: 'Qui • 08/10 - 20:00', hScore: '', aScore: '' },
      { id: 9, home: 'Fluminense', away: 'Coritiba', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' },
      { id: 10, home: 'Palmeiras', away: 'Bahia', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' }
    ];

    const round30 = [
      { id: 11, home: 'Vasco da Gama', away: 'Remo', date: 'Sáb • 10/10 - 18:00', hScore: '', aScore: '' },
      { id: 12, home: 'São Paulo', away: 'Vitória', date: 'Sáb • 10/10 - 21:00', hScore: '', aScore: '' },
      { id: 13, home: 'Atlético-MG', away: 'Santos', date: 'Dom • 11/10 - 16:00', hScore: '', aScore: '' },
      { id: 14, home: 'Flamengo', away: 'Fluminense', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 15, home: 'Palmeiras', away: 'Corinthians', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 16, home: 'Grêmio', away: 'Internacional', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 17, home: 'Bahia', away: 'Mirassol', date: 'Dom • 11/10 - 19:30', hScore: '', aScore: '' },
      { id: 18, home: 'Coritiba', away: 'Botafogo', date: 'Seg • 12/10 - 16:00', hScore: '', aScore: '' },
      { id: 19, home: 'Chapecoense', away: 'Athletico-PR', date: 'Seg • 12/10 - 19:30', hScore: '', aScore: '' },
      { id: 20, home: 'Red Bull Bragantino', away: 'Cruzeiro', date: 'Seg • 12/10 - 21:00', hScore: '', aScore: '' }
    ];

    let activeTeams = JSON.parse(JSON.stringify(initialTeams));
    let activeTab = 'agenda';

    function renderTable() {
      activeTeams.sort((a, b) => (b.pts - a.pts) || (b.v - a.v) || ((b.gp - b.gc) - (a.gp - a.gc)));
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      
      activeTeams.forEach((t, index) => {
        const pos = index + 1;
        const sg = t.gp - t.gc;
        let zoneClass = pos <= 4 ? 'g4' : (pos <= 6 ? 'g6' : (pos >= 17 ? 'z4' : ''));

        tbody.innerHTML += `
          <tr class="${zoneClass}">
            <td>${pos}</td>
            <td class="left">${t.name}</td>
            <td class="pts">${t.pts}</td>
            <td>${t.j}</td>
            <td>${t.v}</td>
            <td>${t.e}</td>
            <td>${t.d}</td>
            <td>${t.gp}</td>
            <td>${t.gc}</td>
            <td>${sg > 0 ? '+' + sg : sg}</td>
          </tr>
        `;
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-agenda').className = tab === 'agenda' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-sim').className = tab === 'simulador' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('sim-actions').style.display = tab === 'simulador' ? 'flex' : 'none';
      document.getElementById('panel-title').textContent = tab === 'agenda' ? 'Próximos Jogos' : 'Simulador';
      document.getElementById('panel-subtitle').textContent = tab === 'agenda' ? 'Agenda Oficial da Série A' : 'Preencha os placares abaixo';
      renderMatches();
    }

    function renderMatches() {
      const selectedRound = document.getElementById('round-select').value;
      const games = selectedRound === '29' ? round29 : round30;
      const container = document.getElementById('matches-list');
      container.innerHTML = '';

      games.forEach(g => {
        if (activeTab === 'agenda') {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-body">
                <span class="team-name" style="text-align: right;">${g.home}</span>
                <span style="color: var(--text-muted); font-size: 0.7rem; padding: 0 8px;">VS</span>
                <span class="team-name" style="text-align: left;">${g.away}</span>
              </div>
            </div>`;
        } else {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-body">
                <span class="team-name" style="text-align: right;">${g.home}</span>
                <div class="score-inputs">
                  <input type="number" min="0" value="${g.hScore}" onchange="updateScore(${g.id}, 'h', this.value)">
                  <span style="color: var(--text-muted); font-size: 0.7rem;">x</span>
                  <input type="number" min="0" value="${g.aScore}" onchange="updateScore(${g.id}, 'a', this.value)">
                </div>
                <span class="team-name" style="text-align: left;">${g.away}</span>
              </div>
            </div>`;
        }
      });
    }

    function updateScore(id, side, val) {
      const allGames = [...round29, ...round30];
      const game = allGames.find(g => g.id === id);
      if (game) {
        if (side === 'h') game.hScore = val;
        else game.aScore = val;
      }
    }

    function confirmSimulation() {
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      const allGames = [...round29, ...round30];

      allGames.forEach(g => {
        if (g.hScore !== '' && g.aScore !== '') {
          const h = parseInt(g.hScore);
          const a = parseInt(g.aScore);
          const home = activeTeams.find(t => t.name === g.home);
          const away = activeTeams.find(t => t.name === g.away);

          if (home && away) {
            home.j++; away.j++; home.gp += h; home.gc += a; away.gp += a; away.gc += h;
            if (h > a) { home.pts += 3; home.v++; away.d++; }
            else if (a > h) { away.pts += 3; away.v++; home.d++; }
            else { home.pts++; away.pts++; home.e++; away.e++; }
          }
        }
      });

      renderTable();
    }

    function resetSimulation() {
      [...round29, ...round30].forEach(g => { g.hScore = ''; g.aScore = ''; });
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      renderMatches();
      renderTable();
    }

    function filterTable() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#table-body tr');

      rows.forEach(row => {
        const teamName = row.children[1].textContent.toLowerCase();
        row.style.display = teamName.includes(query) ? '' : 'none';
      });
    }

    renderTable();
    renderMatches();
  </script>
</body>
</html>
