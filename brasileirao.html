<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Dashboard & Simulador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header / Navbar Principal -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Marca & Título -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-slate-950 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            BRASILEIRÃO <span class="bg-emerald-500/10 text-emerald-400 text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full border border-emerald-500/20 font-semibold">SÉRIE A</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">Classificação Oficial, Agenda de Jogos & Simulador</p>
        </div>
      </div>

      <!-- Player de Áudio Incorporado -->
      <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-xl shadow-inner">
        <svg class="w-4 h-4 text-emerald-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-3"/>
        </svg>
        <span class="text-xs font-semibold text-slate-300 hidden md:inline">Tema Oficial</span>
        <audio controls class="h-7 w-32 sm:w-44 bg-transparent">
          <source src="musica-brasileiro.mp3" type="audio/mpeg">
          Seu navegador não suporta o elemento de áudio.
        </audio>
      </div>

    </div>
  </header>

  <!-- Conteúdo Principal em Layout de Duas Colunas -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LADO ESQUERDO: Tabela do Campeonato (8 Colunas) -->
    <section class="lg:col-span-8 flex flex-col gap-4">
      
      <!-- Barra Superior da Tabela (Busca e Legenda Visual) -->
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-lg backdrop-blur-md">
        <div class="relative w-full sm:w-64">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Buscar time..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl pl-9 pr-3 py-2 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
        </div>

        <div class="flex items-center gap-3 text-[11px] text-slate-400 font-medium">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> G4 Libertadores</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-cyan-500"></span> G6 Pré-Lib.</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Z4</span>
        </div>
      </div>

      <!-- Tabela com Design Sofisticado -->
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-md">
        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-800/50 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-800 select-none">
                <th class="py-3.5 px-3 text-center w-12">#</th>
                <th class="py-3.5 px-3">CLUBE</th>
                <th class="py-3.5 px-2 text-center font-bold text-slate-200">P</th>
                <th class="py-3.5 px-2 text-center">J</th>
                <th class="py-3.5 px-2 text-center">V</th>
                <th class="py-3.5 px-2 text-center">E</th>
                <th class="py-3.5 px-2 text-center">D</th>
                <th class="py-3.5 px-2 text-center">GP</th>
                <th class="py-3.5 px-2 text-center">GC</th>
                <th class="py-3.5 px-2 text-center">SG</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-800/50 text-slate-300">
              <!-- JS -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- LADO DIREITO: Painel Lateral com Abas (4 Colunas) -->
    <aside class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-2xl backdrop-blur-md flex flex-col h-full">
        
        <!-- Cabeçalho com Seletor de Rodada -->
        <div class="border-b border-slate-800/80 pb-3 mb-4 flex flex-col gap-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 id="panel-title" class="text-sm font-bold text-white">Próximos Jogos</h2>
              <p id="panel-subtitle" class="text-[11px] text-slate-400">Agenda Oficial da Série A</p>
            </div>
            
            <select id="round-select" onchange="renderMatches()" class="bg-slate-950 border border-slate-700 text-xs text-emerald-400 font-semibold px-2.5 py-1.5 rounded-lg focus:outline-none cursor-pointer hover:border-emerald-500 transition">
              <option value="29">Rodada 29 (Esta Semana)</option>
              <option value="30">Rodada 30 (Próxima Semana)</option>
            </select>
          </div>

          <!-- Alternador de Abas (Agenda vs Simulador) -->
          <div class="grid grid-cols-2 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button id="tab-agenda" onclick="setActiveTab('agenda')" class="py-1.5 text-xs font-semibold rounded-lg transition text-slate-100 bg-slate-800/90 shadow">
              📅 Agenda
            </button>
            <button id="tab-simulador" onclick="setActiveTab('simulador')" class="py-1.5 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-slate-200">
              ⚡ Simulador
            </button>
          </div>
        </div>

        <!-- Lista de Confrontos -->
        <div id="matches-container" class="flex flex-col gap-3 custom-scrollbar overflow-y-auto max-h-[500px] pr-1">
          <!-- JS -->
        </div>

        <!-- Botões do Simulador -->
        <div id="simulator-actions" class="mt-4 pt-3 border-t border-slate-800 grid grid-cols-2 gap-2 hidden">
          <button onclick="confirmSimulation()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded-xl text-xs shadow-lg shadow-emerald-600/20 transition flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Confirmar
          </button>
          <button onclick="resetSimulation()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 px-3 rounded-xl text-xs border border-slate-700 transition flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Resetar
          </button>
        </div>

      </div>
    </aside>

  </main>

  <script>
    const initialTeams = [
      { name: 'Flamengo', pts: 60, j: 28, v: 18, e: 6, d: 4, gp: 55, gc: 23 },
      { name: 'Palmeiras', pts: 57, j: 28, v: 16, e: 9, d: 3, gp: 47, gc: 21 },
      { name: 'Athletico-PR', pts: 49, j: 28, v: 14, e: 7, d: 7, gp: 43, gc: 32 },
      { name: 'Fluminense', pts: 48, j: 28, v: 13, e: 9, d: 6, gp: 44, gc: 36 },
      { name: 'Bahia', pts: 46, j: 28, v: 12, e: 10, d: 6, gp: 43, gc: 35 },
      { name: 'Cruzeiro', pts: 45, j: 28, v: 13, e: 6, d: 9, gp: 42, gc: 40 },
      { name: 'Atlético-MG', pts: 43, j: 28, v: 12, e: 7, d: 9, gp: 37, gc: 32 },
      { name: 'Santos', pts: 41, j: 28, v: 11, e: 8, d: 9, gp: 43, gc: 41 },
      { name: 'Coritiba', pts: 38, j: 28, v: 10, e: 8, d: 10, gp: 37, gc: 43 },
      { name: 'São Paulo', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Red Bull Bragantino', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Botafogo', pts: 35, j: 28, v: 9, e: 8, d: 11, gp: 41, gc: 45 },
      { name: 'Vitória', pts: 33, j: 28, v: 9, e: 6, d: 13, gp: 28, gc: 42 },
      { name: 'Corinthians', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 29, gc: 32 },
      { name: 'Mirassol', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 33, gc: 42 },
      { name: 'Vasco da Gama', pts: 31, j: 27, v: 8, e: 7, d: 12, gp: 34, gc: 41 },
      { name: 'Grêmio', pts: 29, j: 28, v: 7, e: 8, d: 13, gp: 30, gc: 38 },
      { name: 'Internacional', pts: 28, j: 28, v: 6, e: 10, d: 12, gp: 30, gc: 36 },
      { name: 'Remo', pts: 23, j: 28, v: 5, e: 8, d: 15, gp: 32, gc: 47 },
      { name: 'Chapecoense', pts: 18, j: 27, v: 3, e: 9, d: 15, gp: 29, gc: 53 }
    ];

    const round29Games = [
      { id: 1, home: 'Remo', away: 'Grêmio', date: 'Qua • 07/10', time: '19:30', homeScore: '', awayScore: '' },
      { id: 2, home: 'Red Bull Bragantino', away: 'Mirassol', date: 'Qua • 07/10', time: '19:30', homeScore: '', awayScore: '' },
      { id: 3, home: 'Internacional', away: 'Corinthians', date: 'Qua • 07/10', time: '19:30', homeScore: '', awayScore: '' },
      { id: 4, home: 'Vitória', away: 'Chapecoense', date: 'Qua • 07/10', time: '20:00', homeScore: '', awayScore: '' },
      { id: 5, home: 'Botafogo', away: 'Vasco da Gama', date: 'Qua • 07/10', time: '20:30', homeScore: '', awayScore: '' },
      { id: 6, home: 'Cruzeiro', away: 'São Paulo', date: 'Qua • 07/10', time: '21:30', homeScore: '', awayScore: '' },
      { id: 7, home: 'Santos', away: 'Flamengo', date: 'Qui • 08/10', time: '19:30', homeScore: '', awayScore: '' },
      { id: 8, home: 'Athletico-PR', away: 'Atlético-MG', date: 'Qui • 08/10', time: '20:00', homeScore: '', awayScore: '' },
      { id: 9, home: 'Fluminense', away: 'Coritiba', date: 'Qui • 08/10', time: '21:30', homeScore: '', awayScore: '' },
      { id: 10, home: 'Palmeiras', away: 'Bahia', date: 'Qui • 08/10', time: '21:30', homeScore: '', awayScore: '' }
    ];

    const round30Games = [
      { id: 11, home: 'Vasco da Gama', away: 'Remo', date: 'Sáb • 10/10', time: '18:00', homeScore: '', awayScore: '' },
      { id: 12, home: 'São Paulo', away: 'Vitória', date: 'Sáb • 10/10', time: '21:00', homeScore: '', awayScore: '' },
      { id: 13, home: 'Atlético-MG', away: 'Santos', date: 'Dom • 11/10', time: '16:00', homeScore: '', awayScore: '' },
      { id: 14, home: 'Flamengo', away: 'Fluminense', date: 'Dom • 11/10', time: '17:30', homeScore: '', awayScore: '' },
      { id: 15, home: 'Palmeiras', away: 'Corinthians', date: 'Dom • 11/10', time: '17:30', homeScore: '', awayScore: '' },
      { id: 16, home: 'Grêmio', away: 'Internacional', date: 'Dom • 11/10', time: '17:30', homeScore: '', awayScore: '' },
      { id: 17, home: 'Bahia', away: 'Mirassol', date: 'Dom • 11/10', time: '19:30', homeScore: '', awayScore: '' },
      { id: 18, home: 'Coritiba', away: 'Botafogo', date: 'Seg • 12/10', time: '16:00', homeScore: '', awayScore: '' },
      { id: 19, home: 'Chapecoense', away: 'Athletico-PR', date: 'Seg • 12/10', time: '19:30', homeScore: '', awayScore: '' },
      { id: 20, home: 'Red Bull Bragantino', away: 'Cruzeiro', date: 'Seg • 12/10', time: '21:00', homeScore: '', awayScore: '' }
    ];

    let currentTab = 'agenda';
    let activeTeamsData = JSON.parse(JSON.stringify(initialTeams));

    function renderTable() {
      activeTeamsData.sort((a, b) => {
        const sgA = a.gp - a.gc;
        const sgB = b.gp - b.gc;
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.v !== a.v) return b.v - a.v;
        if (sgB !== sgA) return sgB - sgA;
        return b.gp - a.gp;
      });

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      activeTeamsData.forEach((team, index) => {
        const pos = index + 1;
        const sg = team.gp - team.gc;

        let zoneBorder = 'border-l-transparent';
        if (pos <= 4) zoneBorder = 'border-l-4 border-l-emerald-500 bg-emerald-500/5';
        else if (pos <= 6) zoneBorder = 'border-l-4 border-l-cyan-500 bg-cyan-500/5';
        else if (pos >= 17) zoneBorder = 'border-l-4 border-l-rose-500 bg-rose-500/5';

        const row = document.createElement('tr');
        row.className = `hover:bg-slate-800/50 transition font-medium text-xs ${zoneBorder}`;

        row.innerHTML = `
          <td class="py-3 px-3 text-center font-bold ${pos <= 4 ? 'text-emerald-400' : pos >= 17 ? 'text-rose-400' : 'text-slate-400'}">${pos}</td>
          <td class="py-3 px-3 font-semibold text-slate-100">${team.name}</td>
          <td class="py-3 px-2 text-center font-extrabold text-emerald-400 bg-emerald-500/5">${team.pts}</td>
          <td class="py-3 px-2 text-center text-slate-300">${team.j}</td>
          <td class="py-3 px-2 text-center text-slate-300">${team.v}</td>
          <td class="py-3 px-2 text-center text-slate-400">${team.e}</td>
          <td class="py-3 px-2 text-center text-slate-400">${team.d}</td>
          <td class="py-3 px-2 text-center text-slate-300">${team.gp}</td>
          <td class="py-3 px-2 text-center text-slate-400">${team.gc}</td>
          <td class="py-3 px-2 text-center font-bold ${sg > 0 ? 'text-emerald-400' : sg < 0 ? 'text-rose-400' : 'text-slate-400'}">${sg > 0 ? '+' + sg : sg}</td>
        `;

        tbody.appendChild(row);
      });
    }

    function setActiveTab(tab) {
      currentTab = tab;
      const btnAgenda = document.getElementById('tab-agenda');
      const btnSimulador = document.getElementById('tab-simulador');
      const actionsDiv = document.getElementById('simulator-actions');
      const title = document.getElementById('panel-title');
      const subtitle = document.getElementById('panel-subtitle');

      if (tab === 'agenda') {
        btnAgenda.className = "py-1.5 text-xs font-semibold rounded-lg transition text-slate-100 bg-slate-800 shadow";
        btnSimulador.className = "py-1.5 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-slate-200";
        actionsDiv.classList.add('hidden');
        title.textContent = 'Próximos Jogos';
        subtitle.textContent = 'Agenda Oficial da Série A';
      } else {
        btnSimulador.className = "py-1.5 text-xs font-semibold rounded-lg transition text-slate-100 bg-slate-800 shadow";
        btnAgenda.className = "py-1.5 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-slate-200";
        actionsDiv.classList.remove('hidden');
        title.textContent = 'Simulador de Placares';
        subtitle.textContent = 'Informe os placares e clique em Confirmar';
      }

      renderMatches();
    }

    function renderMatches() {
      const selectedRound = document.getElementById('round-select').value;
      const games = selectedRound === '29' ? round29Games : round30Games;
      const container = document.getElementById('matches-container');
      container.innerHTML = '';

      games.forEach(game => {
        const card = document.createElement('div');
        card.className = "bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col gap-1.5 hover:border-slate-700 transition";

        if (currentTab === 'agenda') {
          card.innerHTML = `
            <div class="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider text-center">${game.date} • ${game.time}</div>
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-slate-200 text-right flex-1 truncate">${game.home}</span>
              <span class="px-2 text-slate-500 font-extrabold text-[11px]">VS</span>
              <span class="font-bold text-slate-200 text-left flex-1 truncate">${game.away}</span>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider text-center">${game.date} • ${game.time}</div>
            <div class="flex items-center justify-between text-xs gap-2">
              <span class="font-bold text-slate-200 text-right flex-1 truncate">${game.home}</span>
              <div class="flex items-center gap-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
                <input type="number" min="0" max="15" value="${game.homeScore}" oninput="updateScore(${game.id}, 'home', this.value)" class="w-6 h-6 bg-slate-950 border border-slate-700 rounded text-center text-xs font-bold text-emerald-400 focus:outline-none">
                <span class="text-[10px] text-slate-500 font-bold">x</span>
                <input type="number" min="0" max="15" value="${game.awayScore}" oninput="updateScore(${game.id}, 'away', this.value)" class="w-6 h-6 bg-slate-950 border border-slate-700 rounded text-center text-xs font-bold text-emerald-400 focus:outline-none">
              </div>
              <span class="font-bold text-slate-200 text-left flex-1 truncate">${game.away}</span>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }

    function updateScore(gameId, side, value) {
      let game = round29Games.find(g => g.id === gameId) || round30Games.find(g => g.id === gameId);
      if (game) {
        if (side === 'home') game.homeScore = value;
        else game.awayScore = value;
      }
    }

    function confirmSimulation() {
      activeTeamsData = JSON.parse(JSON.stringify(initialTeams));
      const allGames = [...round29Games, ...round30Games];

      allGames.forEach(game => {
        if (game.homeScore !== '' && game.awayScore !== '') {
          const hScore = parseInt(game.homeScore);
          const aScore = parseInt(game.awayScore);

          const homeTeam = activeTeamsData.find(t => t.name === game.home);
          const awayTeam = activeTeamsData.find(t => t.name === game.away);

          if (homeTeam && awayTeam) {
            homeTeam.j += 1;
            awayTeam.j += 1;
            homeTeam.gp += hScore;
            homeTeam.gc += aScore;
            awayTeam.gp += aScore;
            awayTeam.gc += hScore;

            if (hScore > aScore) {
              homeTeam.pts += 3;
              homeTeam.v += 1;
              awayTeam.d += 1;
            } else if (aScore > hScore) {
              awayTeam.pts += 3;
              awayTeam.v += 1;
              homeTeam.d += 1;
            } else {
              homeTeam.pts += 1;
              awayTeam.pts += 1;
              homeTeam.e += 1;
              awayTeam.e += 1;
            }
          }
        }
      });

      renderTable();
    }

    function resetSimulation() {
      [...round29Games, ...round30Games].forEach(g => {
        g.homeScore = '';
        g.awayScore = '';
      });

      activeTeamsData = JSON.parse(JSON.stringify(initialTeams));
      renderMatches();
      renderTable();
    }

    function filterTable() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#table-body tr');

      rows.forEach(row => {
        const teamName = row.children[1].textContent.toLowerCase();
        row.style.display = teamName.includes(query) ? '' : 'none';
      });
    }

    renderTable();
    renderMatches();
  </script>
</body>
</html>
