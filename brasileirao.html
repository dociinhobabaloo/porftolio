<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão Série A - Dashboard & Simulador</title>
<style>
:root{--green:#008f4c;--green-dark:#006f3b;--green-soft:#eaf7f0;--blue:#0875c1;--red:#d92d20;--orange:#f59e0b;--ink:#17212b;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6f8;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:0 14px 30px}
header{max-width:1240px;width:100%;margin:18px auto 18px;background:linear-gradient(135deg,var(--green-dark),var(--green));border-radius:14px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 8px 24px rgba(0,80,40,.18)}
.brand{display:flex;align-items:center;gap:14px}.brand-logo-img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.25))}.brand-title h1{font-size:1.18rem;color:#fff;font-weight:900;letter-spacing:.2px}.brand-title p{font-size:.76rem;color:rgba(255,255,255,.78);margin-top:3px}
.audio-player-box{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.18);padding:7px 10px;border-radius:10px}.audio-player-box span{font-size:.72rem;font-weight:800;color:#fff}audio{height:30px;max-width:190px}
.container{max-width:1240px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.06);overflow:hidden}
.table-tools{padding:17px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.search-input{background:#f8fafc;border:1px solid var(--line);color:var(--ink);padding:10px 13px;border-radius:8px;font-size:.8rem;outline:none;width:230px}.search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,143,76,.1)}
.legend{display:flex;gap:13px;font-size:.68rem;color:var(--muted);font-weight:700}.legend-item{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:2px}.legend-item:nth-child(1) .dot{background:var(--green)!important}.legend-item:nth-child(2) .dot{background:var(--blue)!important}.legend-item:nth-child(3) .dot{background:var(--red)!important}
.table-responsive{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-size:.78rem;min-width:700px}thead{background:#f8fafc}th{color:#667085;padding:11px 7px;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}th.left,td.left{text-align:left}td{padding:9px 7px;text-align:center;border-bottom:1px solid #eef0f2;color:#475467}tbody tr:hover{background:#fafdfb}.club-cell{display:flex;align-items:center;gap:11px}.club-badge-img{width:31px;height:31px;object-fit:contain;flex-shrink:0;filter:none;border-radius:0}.club-fallback{width:31px;height:31px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:#eef2f3;color:#344054;font-size:9px;font-weight:900;flex-shrink:0}.club-name{font-weight:750;color:#1f2937}.pts{font-weight:900!important;color:var(--ink);background:transparent!important}
tbody tr.g4 td:first-child{border-left:4px solid var(--green)}tbody tr.g6 td:first-child{border-left:4px solid var(--blue)}tbody tr.z4 td:first-child{border-left:4px solid var(--red)}tbody tr.g4 td:first-child,tbody tr.g6 td:first-child,tbody tr.z4 td:first-child{font-weight:900;color:var(--ink)}
.panel-header{padding:17px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.panel-header h2{font-size:.9rem;font-weight:850}.round-select{background:#fff;color:var(--green-dark);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:.7rem;font-weight:800;outline:none}
.tabs{display:flex;gap:4px;background:#f3f5f6;padding:4px;border-radius:9px;margin:14px 18px 12px}.tab-btn{flex:1;padding:9px 6px;border:none;background:transparent;color:var(--muted);font-weight:800;cursor:pointer;border-radius:7px;font-size:.72rem}.tab-btn.active{background:#fff;color:var(--green-dark);box-shadow:0 1px 5px rgba(0,0,0,.08)}
.matches-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;padding:0 18px 18px}.match-item{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:11px}.match-date{font-size:.6rem;color:var(--green-dark);text-align:center;font-weight:850;margin-bottom:8px;text-transform:uppercase}.match-teams{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:750;gap:7px}.team-col{flex:1;display:flex;align-items:center;gap:7px;overflow:hidden}.team-col.home{justify-content:flex-end}.team-col.away{justify-content:flex-start}.team-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.match-badge{width:25px;height:25px;object-fit:contain;flex-shrink:0}.score-inputs{display:flex;align-items:center;gap:4px}.score-inputs input{width:32px;height:30px;background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--green-dark);text-align:center;font-weight:900;font-size:.8rem;outline:none}.vs{color:#98a2b3;font-size:.68rem}.btn-group{display:flex;gap:8px;margin:0 18px 18px;padding-top:12px;border-top:1px solid var(--line)}.btn{flex:1;padding:11px 8px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:.72rem}.btn-confirm{background:var(--green);color:#fff}.btn-reset{background:#f5f6f7;color:#667085;border:1px solid var(--line)}.status{font-size:.68rem;color:var(--muted);margin:0 18px 14px;text-align:center}.empty{padding:20px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:959px){.container{grid-template-columns:1fr}}
@media(max-width:639px){body{padding:0 8px 20px}header{margin:8px auto 12px;padding:14px;border-radius:11px}.brand-logo-img{width:48px;height:48px}.brand-title h1{font-size:1rem}.audio-player-box{display:none}.table-tools{align-items:stretch;flex-direction:column}.search-input{width:100%}.legend{justify-content:center}.card{border-radius:11px}}
.club-badge{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;}
.club-badge-img{width:28px;height:28px;object-fit:contain;display:block;}
.club-fallback{display:none;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:#202833;color:#fff;font-size:.55rem;font-weight:900;}
.club-cell{gap:9px;}
.club-name{font-weight:750;}
.position{width:42px;color:#98a2b3;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img id="league-logo" src="https://raw.githubusercontent.com/Lobobinho/Escudos-dos-Clubes-do-Brasileirao-2026/master/Brasileir%C3%A3o%20S%C3%A9rie%20A%20HD.png" alt="Logo Brasileirão" class="brand-logo-img"
      onerror="this.style.display='none'">
    <div class="brand-title"><h1>BRASILEIRÃO SÉRIE A</h1><p>Classificação, Agenda & Simulador</p></div>
  </div>
  <div class="audio-player-box"><span>♫ Tema</span><audio id="audio-fundo" controls loop preload="none"><source src="musica-brasileirao.mp3" type="audio/mpeg"></audio></div>
</header>

<div class="container">
<section class="card">
  <div style="padding:18px 18px 0"><div style="font-size:.98rem;font-weight:900">Classificação</div><div style="font-size:.68rem;color:#98a2b3;margin-top:3px">Brasileirão Série A · tabela de pontos</div></div>
  <div class="table-tools">
    <input type="text" id="search-input" class="search-input" placeholder="Buscar time...">
    <div class="legend"><div class="legend-item"><div class="dot" style="background:var(--g4)"></div>G4</div><div class="legend-item"><div class="dot" style="background:var(--g6)"></div>G6</div><div class="legend-item"><div class="dot" style="background:var(--z4)"></div>Z4</div></div>
  </div>
  <div class="table-responsive"><table><thead><tr><th>#</th><th class="left">Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody id="table-body"></tbody></table></div>
</section>

<section class="card">
  <div class="panel-header"><h2 id="panel-title">Próximos Jogos</h2><select id="round-select" class="round-select"><option value="29">Rodada 29</option><option value="30">Rodada 30</option></select></div>
  <div class="tabs"><button id="tab-agenda" class="tab-btn active">📅 Agenda</button><button id="tab-sim" class="tab-btn">⚡ Simulador</button></div>
  <div id="matches-list" class="matches-list"></div>
  <div id="sim-actions" class="btn-group" style="display:none"><button class="btn btn-confirm" id="confirm-btn">Confirmar Placares</button><button class="btn btn-reset" id="reset-btn">Resetar</button></div>
  <div id="status" class="status"></div>
</section>
</div>

<script>
/* Escudos reais da Série A 2026. Fonte: repositório público de escudos em HD. */
const ASSET_BASE = "https://raw.githubusercontent.com/Lobobinho/Escudos-dos-Clubes-do-Brasileirao-2026/master/";
const clubs = [
 {name:"Athletico-PR",short:"CAP",pts:49,j:28,v:14,e:7,d:7,gp:39,gc:28,logo:"Athletico Paranaense.png"},
 {name:"Atlético-MG",short:"CAM",pts:43,j:28,v:12,e:7,d:9,gp:38,gc:33,logo:"Atlético Mineiro.png"},
 {name:"Bahia",short:"BAH",pts:46,j:28,v:12,e:10,d:6,gp:37,gc:29,logo:"Bahia.png"},
 {name:"Botafogo",short:"BOT",pts:35,j:28,v:9,e:8,d:11,gp:32,gc:36,logo:"Botafogo.png"},
 {name:"Chapecoense",short:"CHA",pts:18,j:27,v:4,e:6,d:17,gp:24,gc:48,logo:"Chapecoense.png"},
 {name:"Corinthians",short:"COR",pts:32,j:28,v:8,e:8,d:12,gp:29,gc:32,logo:"Corinthians.png"},
 {name:"Coritiba",short:"CFC",pts:38,j:28,v:10,e:8,d:10,gp:31,gc:37,logo:"Coritiba.png"},
 {name:"Cruzeiro",short:"CRU",pts:45,j:28,v:12,e:9,d:7,gp:35,gc:33,logo:"Cruzeiro.png"},
 {name:"Flamengo",short:"FLA",pts:60,j:28,v:18,e:6,d:4,gp:55,gc:23,logo:"Flamengo.png"},
 {name:"Fluminense",short:"FLU",pts:48,j:28,v:13,e:9,d:6,gp:44,gc:36,logo:"Fluminense.png"},
 {name:"Grêmio",short:"GRE",pts:29,j:28,v:7,e:8,d:13,gp:28,gc:36,logo:"Grêmio.png"},
 {name:"Internacional",short:"INT",pts:28,j:28,v:7,e:7,d:14,gp:27,gc:33,logo:"Internacional.png"},
 {name:"Mirassol",short:"MIR",pts:32,j:28,v:8,e:8,d:12,gp:29,gc:38,logo:"Mirassol.png"},
 {name:"Palmeiras",short:"PAL",pts:57,j:28,v:17,e:6,d:5,gp:45,gc:19,logo:"Palmeiras.png"},
 {name:"RB Bragantino",short:"RBB",pts:36,j:28,v:10,e:6,d:12,gp:34,gc:33,logo:"Red Bull Bragantino.png"},
 {name:"Remo",short:"REM",pts:23,j:28,v:6,e:5,d:17,gp:25,gc:40,logo:"Remo.png"},
 {name:"Santos",short:"SAN",pts:41,j:28,v:11,e:8,d:9,gp:35,gc:33,logo:"Santos.png"},
 {name:"São Paulo",short:"SAO",pts:36,j:28,v:9,e:9,d:10,gp:30,gc:29,logo:"São Paulo.png"},
 {name:"Vasco da Gama",short:"VAS",pts:31,j:27,v:8,e:7,d:12,gp:30,gc:37,logo:"Vasco da Gama.png"},
 {name:"Vitória",short:"VIT",pts:33,j:28,v:8,e:9,d:11,gp:29,gc:43,logo:"Vitória.png"}
];
const matches={
  29:[
   ["Flamengo","Cruzeiro"],["Palmeiras","Bahia"],["Fluminense","Botafogo"],["Corinthians","Santos"],["São Paulo","Internacional"],
   ["Vasco da Gama","Vitória"],["Grêmio","Juventude"],["Mirassol","RB Bragantino"],["Atlético-MG","Ceará"],["Fortaleza","Sport"]
  ],
  30:[
   ["Cruzeiro","Flamengo"],["Bahia","Palmeiras"],["Botafogo","Fluminense"],["Santos","Corinthians"],["Internacional","São Paulo"],
   ["Vitória","Vasco da Gama"],["Juventude","Grêmio"],["RB Bragantino","Mirassol"],["Ceará","Atlético-MG"],["Sport","Fortaleza"]
  ]
};
function findClub(name){return clubs.find(c=>c.name===name)||{name,short:"?"};}

function logoURL(club){
  if(!club || !club.logo) return "";
  return ASSET_BASE + encodeURIComponent(club.logo);
}

function badgeHTML(club, extraClass="") {
  const safeName = String(club?.name || "").replace(/"/g,"&quot;");
  const short = String(club?.short || "?").replace(/</g,"&lt;");
  const src = logoURL(club);
  return `<span class="club-badge ${extraClass}">
    <img class="club-badge-img" src="${src}" alt="Escudo ${safeName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <span class="club-fallback">${short}</span>
  </span>`;
}

function renderTable(){
  const tbody=document.getElementById("table-body");
  const search=(document.getElementById("search-input")?.value || "").trim().toLowerCase();
  const sorted=[...clubs].sort((a,b)=>b.pts-a.pts || (b.gp-b.gc)-(a.gp-a.gc) || b.v-a.v || a.name.localeCompare(b.name,"pt-BR"));
  const visible=sorted.filter(c=>c.name.toLowerCase().includes(search));
  tbody.innerHTML=visible.map((c,index)=>{
    const pos=sorted.indexOf(c)+1;
    const zone=pos<=4?"g4":pos<=6?"g6":pos>=17?"z4":"";
    const sg=c.gp-c.gc;
    return `<tr class="${zone}">
      <td class="position"><strong>${pos}</strong></td>
      <td class="left club-cell">${badgeHTML(c)}<span class="club-name">${c.name}</span></td>
      <td class="pts"><strong>${c.pts}</strong></td>
      <td>${c.j}</td><td>${c.v}</td><td>${c.e}</td><td>${c.d}</td>
      <td>${c.gp}</td><td>${c.gc}</td><td>${sg>0?"+":""}${sg}</td>
    </tr>`;
  }).join("");
  loadLogos();
}

function loadLogos(){
  document.querySelectorAll(".club-badge-img").forEach(img=>{
    img.addEventListener("load",()=>{
      img.style.display="block";
      if(img.nextElementSibling) img.nextElementSibling.style.display="none";
    },{once:true});
  });
}
let simulator=false;
function matchHTML(home,away,i){
 const h=findClub(home),a=findClub(away);
 return `<div class="match-item"><div class="match-date">Jogo ${i+1}</div><div class="match-teams">
 <div class="team-col home"><span class="team-name">${h.name}</span>${badgeHTML(h,"match-badge")}</div>
 ${simulator?`<div class="score-inputs"><input type="number" min="0" max="20" value="0" data-home="${h.name}"><span class="vs">x</span><input type="number" min="0" max="20" value="0" data-away="${a.name}"></div>`:`<span class="vs">×</span>`}
 <div class="team-col away">${badgeHTML(a,"match-badge")}<span class="team-name">${a.name}</span></div>
 </div></div>`;
}
function renderMatches(){
 const round=document.getElementById("round-select").value;
 const list=document.getElementById("matches-list");
 list.innerHTML=(matches[round]||[]).map((m,i)=>matchHTML(m[0],m[1],i)).join("")||`<div class="empty">Nenhum jogo cadastrado.</div>`;
 loadLogos();
 document.getElementById("sim-actions").style.display=simulator?"flex":"none";
 document.getElementById("panel-title").textContent=simulator?"Simulador de Resultados":"Próximos Jogos";
}
function switchTab(tab){
 simulator=tab==="simulador";
 document.getElementById("tab-agenda").classList.toggle("active",!simulator);
 document.getElementById("tab-sim").classList.toggle("active",simulator);
 renderMatches();
}
function confirmSimulation(){document.getElementById("status").textContent="Placares confirmados nesta simulação. A classificação visual pode ser recalculada a partir dos resultados.";document.getElementById("status").style.color="var(--accent)"}
function resetSimulation(){renderMatches();document.getElementById("status").textContent=""}
document.getElementById("search-input").addEventListener("input",renderTable);
document.getElementById("round-select").addEventListener("change",renderMatches);
document.getElementById("tab-agenda").addEventListener("click",()=>switchTab("agenda"));
document.getElementById("tab-sim").addEventListener("click",()=>switchTab("simulador"));
document.getElementById("confirm-btn").addEventListener("click",confirmSimulation);
document.getElementById("reset-btn").addEventListener("click",resetSimulation);

renderTable();renderMatches();
</script>
</body>
</html>
