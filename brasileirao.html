<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Tabela & Agenda Interativa</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #2ea043;
      --text: #f0f6fc;
      --text-sub: #8b949e;
      --g4: #2ea043;
      --g6: #388bfd;
      --z4: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    header p { color: var(--text-sub); font-size: 0.85rem; margin-top: 4px; }

    .container { display: grid; grid-template-columns: 1fr 360px; gap: 20px; max-width: 1240px; margin: 0 auto; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

    /* Tabela */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { color: var(--text-sub); padding: 10px 8px; text-align: center; border-bottom: 2px solid var(--border); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    th.left, td.left { text-align: left; }
    td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:hover { background: rgba(255,255,255,0.03); }

    tr.g4 td:first-child { border-left: 3px solid var(--g4); }
    tr.g6 td:first-child { border-left: 3px solid var(--g6); }
    tr.z4 td:first-child { border-left: 3px solid var(--z4); }

    .pts { font-weight: 800; color: var(--accent); }

    /* Painel Lateral */
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 12px; }
    .panel-header h2 { font-size: 0.95rem; font-weight: 700; }
    
    .tabs { display: flex; gap: 6px; background: #0d1117; padding: 4px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-sub); font-weight: 600; cursor: pointer; border-radius: 6px; font-size: 0.8rem; transition: 0.2s; }
    .tab-btn.active { background: var(--card-bg); color: #fff; }

    /* Lista de Jogos */
    .matches-list { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .match-item { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .match-date { font-size: 0.7rem; color: var(--accent); text-align: center; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    .match-teams { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 600; }
    .team-name { flex: 1; text-align: center; }
    
    .score-inputs { display: flex; align-items: center; gap: 4px; }
    .score-inputs input { width: 32px; height: 32px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; text-align: center; font-weight: bold; font-size: 0.85rem; }
    .score-inputs input:focus { outline: none; border-color: var(--accent); }

    /* Botões */
    .btn-group { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .btn-confirm { background: var(--accent); color: #fff; }
    .btn-confirm:hover { background: #268a39; }
    .btn-reset { background: #21262d; color: var(--text-sub); border: 1px solid var(--border); }
    .btn-reset:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>BRASILEIRÃO SÉRIE A</h1>
    <p>Classificação Oficial, Agenda de Jogos & Simulador</p>
  </header>

  <div class="container">
    
    <!-- Tabela Principal -->
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Clube</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dados gerados via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Painel Lateral (Agenda & Simulador) -->
    <div class="card">
      <div class="panel-header">
        <h2 id="panel-title">Próximos Jogos</h2>
        <select id="round-select" onchange="renderMatches()" style="background: #0d1117; color: var(--accent); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; outline: none; cursor: pointer;">
          <option value="29">Rodada 29 (Esta Semana)</option>
          <option value="30">Rodada 30 (Próxima Semana)</option>
        </select>
      </div>

      <!-- Alternador de Abas -->
      <div class="tabs">
        <button id="tab-agenda" class="tab-btn active" onclick="switchTab('agenda')">📅 Agenda</button>
        <button id="tab-sim" class="tab-btn" onclick="switchTab('simulador')">⚡ Simulador</button>
      </div>

      <!-- Container de Jogos -->
      <div id="matches-list" class="matches-list">
        <!-- Jogos via JS -->
      </div>

      <!-- Botões de Ação do Simulador -->
      <div id="sim-actions" class="btn-group" style="display: none;">
        <button class="btn btn-confirm" onclick="confirmSimulation()">Confirmar Placares</button>
        <button class="btn btn-reset" onclick="resetSimulation()">Resetar</button>
      </div>
    </div>

  </div>

  <script>
    const initialTeams = [
      { name: 'Flamengo', pts: 60, j: 28, v: 18, e: 6, d: 4, gp: 55, gc: 23 },
      { name: 'Palmeiras', pts: 57, j: 28, v: 16, e: 9, d: 3, gp: 47, gc: 21 },
      { name: 'Athletico-PR', pts: 49, j: 28, v: 14, e: 7, d: 7, gp: 43, gc: 32 },
      { name: 'Fluminense', pts: 48, j: 28, v: 13, e: 9, d: 6, gp: 44, gc: 36 },
      { name: 'Bahia', pts: 46, j: 28, v: 12, e: 10, d: 6, gp: 43, gc: 35 },
      { name: 'Cruzeiro', pts: 45, j: 28, v: 13, e: 6, d: 9, gp: 42, gc: 40 },
      { name: 'Atlético-MG', pts: 43, j: 28, v: 12, e: 7, d: 9, gp: 37, gc: 32 },
      { name: 'Santos', pts: 41, j: 28, v: 11, e: 8, d: 9, gp: 43, gc: 41 },
      { name: 'Coritiba', pts: 38, j: 28, v: 10, e: 8, d: 10, gp: 37, gc: 43 },
      { name: 'São Paulo', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Red Bull Bragantino', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Botafogo', pts: 35, j: 28, v: 9, e: 8, d: 11, gp: 41, gc: 45 },
      { name: 'Vitória', pts: 33, j: 28, v: 9, e: 6, d: 13, gp: 28, gc: 42 },
      { name: 'Corinthians', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 29, gc: 32 },
      { name: 'Mirassol', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 33, gc: 42 },
      { name: 'Vasco da Gama', pts: 31, j: 27, v: 8, e: 7, d: 12, gp: 34, gc: 41 },
      { name: 'Grêmio', pts: 29, j: 28, v: 7, e: 8, d: 13, gp: 30, gc: 38 },
      { name: 'Internacional', pts: 28, j: 28, v: 6, e: 10, d: 12, gp: 30, gc: 36 },
      { name: 'Remo', pts: 23, j: 28, v: 5, e: 8, d: 15, gp: 32, gc: 47 },
      { name: 'Chapecoense', pts: 18, j: 27, v: 3, e: 9, d: 15, gp: 29, gc: 53 }
    ];

    // JOGOS COMPLETOS DA RODADA 29
    const round29 = [
      { id: 1, home: 'Remo', away: 'Grêmio', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 2, home: 'Red Bull Bragantino', away: 'Mirassol', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 3, home: 'Internacional', away: 'Corinthians', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 4, home: 'Vitória', away: 'Chapecoense', date: 'Qua • 07/10 - 20:00', hScore: '', aScore: '' },
      { id: 5, home: 'Botafogo', away: 'Vasco da Gama', date: 'Qua • 07/10 - 20:30', hScore: '', aScore: '' },
      { id: 6, home: 'Cruzeiro', away: 'São Paulo', date: 'Qua • 07/10 - 21:30', hScore: '', aScore: '' },
      { id: 7, home: 'Santos', away: 'Flamengo', date: 'Qui • 08/10 - 19:30', hScore: '', aScore: '' },
      { id: 8, home: 'Athletico-PR', away: 'Atlético-MG', date: 'Qui • 08/10 - 20:00', hScore: '', aScore: '' },
      { id: 9, home: 'Fluminense', away: 'Coritiba', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' },
      { id: 10, home: 'Palmeiras', away: 'Bahia', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' }
    ];

    // JOGOS COMPLETOS DA RODADA 30 (PRÓXIMA SEMANA)
    const round30 = [
      { id: 11, home: 'Vasco da Gama', away: 'Remo', date: 'Sáb • 10/10 - 18:00', hScore: '', aScore: '' },
      { id: 12, home: 'São Paulo', away: 'Vitória', date: 'Sáb • 10/10 - 21:00', hScore: '', aScore: '' },
      { id: 13, home: 'Atlético-MG', away: 'Santos', date: 'Dom • 11/10 - 16:00', hScore: '', aScore: '' },
      { id: 14, home: 'Flamengo', away: 'Fluminense', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 15, home: 'Palmeiras', away: 'Corinthians', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 16, home: 'Grêmio', away: 'Internacional', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 17, home: 'Bahia', away: 'Mirassol', date: 'Dom • 11/10 - 19:30', hScore: '', aScore: '' },
      { id: 18, home: 'Coritiba', away: 'Botafogo', date: 'Seg • 12/10 - 16:00', hScore: '', aScore: '' },
      { id: 19, home: 'Chapecoense', away: 'Athletico-PR', date: 'Seg • 12/10 - 19:30', hScore: '', aScore: '' },
      { id: 20, home: 'Red Bull Bragantino', away: 'Cruzeiro', date: 'Seg • 12/10 - 21:00', hScore: '', aScore: '' }
    ];

    let activeTeams = JSON.parse(JSON.stringify(initialTeams));
    let activeTab = 'agenda';

    function renderTable() {
      activeTeams.sort((a, b) => (b.pts - a.pts) || (b.v - a.v) || ((b.gp - b.gc) - (a.gp - a.gc)));
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      
      activeTeams.forEach((t, index) => {
        const pos = index + 1;
        const sg = t.gp - t.gc;
        let zoneClass = pos <= 4 ? 'g4' : (pos <= 6 ? 'g6' : (pos >= 17 ? 'z4' : ''));

        tbody.innerHTML += `
          <tr class="${zoneClass}">
            <td><b>${pos}</b></td>
            <td class="left"><b>${t.name}</b></td>
            <td class="pts">${t.pts}</td>
            <td>${t.j}</td>
            <td>${t.v}</td>
            <td>${t.e}</td>
            <td>${t.d}</td>
            <td>${t.gp}</td>
            <td>${t.gc}</td>
            <td>${sg > 0 ? '+' + sg : sg}</td>
          </tr>
        `;
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-agenda').className = tab === 'agenda' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-sim').className = tab === 'simulador' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('sim-actions').style.display = tab === 'simulador' ? 'flex' : 'none';
      document.getElementById('panel-title').textContent = tab === 'agenda' ? 'Próximos Jogos' : 'Simulador de Placares';
      renderMatches();
    }

    function renderMatches() {
      const selectedRound = document.getElementById('round-select').value;
      const games = selectedRound === '29' ? round29 : round30;
      const container = document.getElementById('matches-list');
      container.innerHTML = '';

      games.forEach(g => {
        if (activeTab === 'agenda') {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-teams">
                <span class="team-name">${g.home}</span>
                <span style="color: var(--text-sub); font-size: 0.7rem; padding: 0 6px;">VS</span>
                <span class="team-name">${g.away}</span>
              </div>
            </div>`;
        } else {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-teams">
                <span class="team-name" style="text-align: right;">${g.home}</span>
                <div class="score-inputs">
                  <input type="number" min="0" value="${g.hScore}" onchange="updateScore(${g.id}, 'h', this.value)">
                  <span style="color: var(--text-sub); font-size: 0.75rem;">x</span>
                  <input type="number" min="0" value="${g.aScore}" onchange="updateScore(${g.id}, 'a', this.value)">
                </div>
                <span class="team-name" style="text-align: left;">${g.away}</span>
              </div>
            </div>`;
        }
      });
    }

    function updateScore(id, side, val) {
      const allGames = [...round29, ...round30];
      const game = allGames.find(g => g.id === id);
      if (game) {
        if (side === 'h') game.hScore = val;
        else game.aScore = val;
      }
    }

    function confirmSimulation() {
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      const allGames = [...round29, ...round30];

      allGames.forEach(g => {
        if (g.hScore !== '' && g.aScore !== '') {
          const h = parseInt(g.hScore);
          const a = parseInt(g.aScore);
          const home = activeTeams.find(t => t.name === g.home);
          const away = activeTeams.find(t => t.name === g.away);

          if (home && away) {
            home.j++; away.j++; home.gp += h; home.gc += a; away.gp += a; away.gc += h;
            if (h > a) { home.pts += 3; home.v++; away.d++; }
            else if (a > h) { away.pts += 3; away.v++; home.d++; }
            else { home.pts++; away.pts++; home.e++; away.e++; }
          }
        }
      });

      renderTable();
    }

    function resetSimulation() {
      [...round29, ...round30].forEach(g => { g.hScore = ''; g.aScore = ''; });
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      renderMatches();
      renderTable();
    }

    renderTable();
    renderMatches();
  </script>
</body>
</html>
