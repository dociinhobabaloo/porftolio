<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Dashboard & Simulador Interativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header / Navbar Sofisticado -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Título & Logo -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-slate-950 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            BRASILEIRÃO <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2 py-0.5 rounded-full border border-emerald-500/20 font-medium">SÉRIE A</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">Classificação Oficial, Agenda & Simulador</p>
        </div>
      </div>

      <!-- Player de Música Incorporado do GitHub -->
      <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl">
        <svg class="w-4 h-4 text-emerald-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-3"/>
        </svg>
        <span class="text-xs font-semibold text-slate-300 hidden md:inline">Tema Oficial</span>
        <audio controls class="h-7 w-32 sm:w-48 bg-transparent">
          <source src="musica-brasileiro.mp3" type="audio/mpeg">
          Seu navegador não suporta o elemento de áudio.
        </audio>
      </div>

    </div>
  </header>

  <!-- Conteúdo Principal - Layout Lado a Lado -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LADO ESQUERDO: Tabela de Classificação (8 colunas) -->
    <section class="lg:col-span-8 flex flex-col gap-4">
      
      <!-- Barra de Pesquisa e Legenda -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
        <div class="relative w-full sm:w-64">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Buscar time por nome..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div class="flex items-center gap-3 text-[11px] text-slate-400 font-medium">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> G4 Libertadores</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-cyan-500"></span> G6 Pré-Lib.</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Z4</span>
        </div>
      </div>

      <!-- Tabela Estilizada -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-800/60 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-800 select-none">
                <th class="py-3 px-3 text-center w-12">#</th>
                <th class="py-3 px-3">CLUBE</th>
                <th class="py-3 px-2 text-center font-bold text-slate-200">P</th>
                <th class="py-3 px-2 text-center">J</th>
                <th class="py-3 px-2 text-center">V</th>
                <th class="py-3 px-2 text-center">E</th>
                <th class="py-3 px-2 text-center">D</th>
                <th class="py-3 px-2 text-center">GP</th>
                <th class="py-3 px-2 text-center">GC</th>
                <th class="py-3 px-2 text-center">SG</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-800/60 text-slate-300">
              <!-- Renderizado via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- LADO DIREITO: Painel Lateral com Abas (4 colunas) -->
    <aside class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col h-full">
        
        <!-- Cabeçalho do Painel com Seletor de Rodada -->
        <div class="border-b border-slate-800 pb-3 mb-4 flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <div>
              <h2 id="panel-title" class="text-sm font-bold text-white">Próximos Jogos</h2>
              <p id="panel-subtitle" class="text-[11px] text-slate-400">Agenda Oficial da Série A</p>
            </div>
            <!-- Seletor de Rodada -->
            <select id="round-select" onchange="renderMatches()" class="bg-slate-950 border border-slate-700 text-xs text-emerald-400 font-semibold px-2 py-1 rounded focus:outline-none cursor-pointer">
              <option value="29">Rodada 29 (Esta Semana)</option>
              <option value="30">Rodada 30 (Próxima Semana)</option>
            </select>
          </div>

          <!-- Botões de Alternância entre Agenda e Simulador -->
          <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button id="tab-agenda" onclick="setActiveTab('agenda')" class="py-1.5 text-xs font-semibold rounded-md transition text-slate-100 bg-slate-800 shadow">
              📅 Agenda
            </button>
            <button id="tab-simulador" onclick="setActiveTab('simulador')" class="py-1.5 text-xs font-semibold rounded-md transition text-slate-400 hover:text-slate-200">
              ⚡ Simulador
            </button>
          </div>
        </div>

        <!-- Conteúdo Principal da Lateral (Lista de Jogos) -->
        <div id="matches-container" class="flex flex-col gap-3 custom-scrollbar overflow-y-auto max-h-[500px] pr-1">
          <!-- Renderizado via JS -->
        </div>

        <!-- Rodapé do Simulador com Ações (Apenas visível na aba Simulador) -->
        <div id="simulator-actions" class="mt-4 pt-3 border-t border-slate-800 grid grid-cols-2 gap-2 hidden">
          <button onclick="confirmSimulation()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded-lg text-xs shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Confirmar Placares
          </button>
          <button onclick="resetSimulation()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 px-3 rounded-lg text-xs border border-slate-700 transition flex items-center justify-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Resetar
          </button>
        </div>

      </div>
    </aside>

  </main>
