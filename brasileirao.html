<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Tabela & Simulador</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; color: #fff; }
    header p { color: var(--text-muted); font-size: 0.9rem; }
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #0f172a; padding: 4px; border-radius: 8px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 6px; font-size: 0.8rem; }
    .tab-btn.active { background: var(--card-bg); color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { color: var(--text-muted); padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border); }
    th.left, td.left { text-align: left; }
    td { padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .pts { font-weight: bold; color: var(--accent); }
    .match { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .match-header { font-size: 0.75rem; color: var(--accent); text-align: center; margin-bottom: 6px; font-weight: bold; }
    .match-body { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; gap: 6px; }
    .score-box { display: flex; align-items: center; gap: 4px; }
    .score-box input { width: 30px; height: 30px; background: #0f172a; border: 1px solid var(--border); border-radius: 4px; color: #fff; text-align: center; font-weight: bold; }
    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .btn-confirm { background: var(--accent); color: #fff; }
    .btn-reset { background: #334155; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>Brasileirão Série A</h1>
    <p>Classificação Oficial & Agenda da Competição</p>
  </header>

  <div class="layout">
    <!-- Tabela -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th class="left">Clube</th>
            <th>P</th>
            <th>J</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>GP</th>
            <th>GC</th>
            <th>SG</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- Painel Lateral -->
    <div class="card">
      <div class="tabs">
        <button id="tab-agenda" class="tab-btn active" onclick="switchTab('agenda')">Agenda</button>
        <button id="tab-sim" class="tab-btn" onclick="switchTab('simulador')">Simulador</button>
      </div>

      <div id="matches-list"></div>

      <div id="sim-actions" class="btn-group" style="display: none;">
        <button class="btn btn-confirm" onclick="confirmSimulation()">Confirmar</button>
        <button class="btn btn-reset" onclick="resetSimulation()">Resetar</button>
      </div>
    </div>
  </div>

  <script>
    const initialTeams = [
      { name: 'Flamengo', pts: 60, j: 28, v: 18, e: 6, d: 4, gp: 55, gc: 23 },
      { name: 'Palmeiras', pts: 57, j: 28, v: 16, e: 9, d: 3, gp: 47, gc: 21 },
      { name: 'Athletico-PR', pts: 49, j: 28, v: 14, e: 7, d: 7, gp: 43, gc: 32 },
      { name: 'Fluminense', pts: 48, j: 28, v: 13, e: 9, d: 6, gp: 44, gc: 36 },
      { name: 'Bahia', pts: 46, j: 28, v: 12, e: 10, d: 6, gp: 43, gc: 35 },
      { name: 'Cruzeiro', pts: 45, j: 28, v: 13, e: 6, d: 9, gp: 42, gc: 40 },
      { name: 'Atlético-MG', pts: 43, j: 28, v: 12, e: 7, d: 9, gp: 37, gc: 32 },
      { name: 'Santos', pts: 41, j: 28, v: 11, e: 8, d: 9, gp: 43, gc: 41 },
      { name: 'Coritiba', pts: 38, j: 28, v: 10, e: 8, d: 10, gp: 37, gc: 43 },
      { name: 'São Paulo', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'RB Bragantino', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Botafogo', pts: 35, j: 28, v: 9, e: 8, d: 11, gp: 41, gc: 45 },
      { name: 'Vitória', pts: 33, j: 28, v: 9, e: 6, d: 13, gp: 28, gc: 42 },
      { name: 'Corinthians', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 29, gc: 32 },
      { name: 'Mirassol', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 33, gc: 42 },
      { name: 'Vasco da Gama', pts: 31, j: 27, v: 8, e: 7, d: 12, gp: 34, gc: 41 },
      { name: 'Grêmio', pts: 29, j: 28, v: 7, e: 8, d: 13, gp: 30, gc: 38 },
      { name: 'Internacional', pts: 28, j: 28, v: 6, e: 10, d: 12, gp: 30, gc: 36 },
      { name: 'Remo', pts: 23, j: 28, v: 5, e: 8, d: 15, gp: 32, gc: 47 },
      { name: 'Chapecoense', pts: 18, j: 27, v: 3, e: 9, d: 15, gp: 29, gc: 53 }
    ];

    const roundGames = [
      { id: 1, home: 'Remo', away: 'Grêmio', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 2, home: 'RB Bragantino', away: 'Mirassol', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 3, home: 'Internacional', away: 'Corinthians', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 4, home: 'Santos', away: 'Flamengo', date: 'Qui • 08/10 - 19:30', hScore: '', aScore: '' },
      { id: 5, home: 'Palmeiras', away: 'Bahia', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' }
    ];

    let currentTeams = JSON.parse(JSON.stringify(initialTeams));
    let activeTab = 'agenda';

    function renderTable() {
      currentTeams.sort((a, b) => (b.pts - a.pts) || (b.v - a.v) || ((b.gp - b.gc) - (a.gp - a.gc)));
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      currentTeams.forEach((t, i) => {
        const sg = t.gp - t.gc;
        tbody.innerHTML += `
          <tr>
            <td><b>${i + 1}</b></td>
            <td class="left"><b>${t.name}</b></td>
            <td class="pts">${t.pts}</td>
            <td>${t.j}</td>
            <td>${t.v}</td>
            <td>${t.e}</td>
            <td>${t.d}</td>
            <td>${t.gp}</td>
            <td>${t.gc}</td>
            <td>${sg > 0 ? '+' + sg : sg}</td>
          </tr>`;
      });
    }

    function renderMatches() {
      const container = document.getElementById('matches-list');
      container.innerHTML = '';
      roundGames.forEach(g => {
        if (activeTab === 'agenda') {
          container.innerHTML += `
            <div class="match">
              <div class="match-header">${g.date}</div>
              <div class="match-body">
                <span><b>${g.home}</b></span>
                <span style="color: var(--text-muted); font-size: 0.75rem;">VS</span>
                <span><b>${g.away}</b></span>
              </div>
            </div>`;
        } else {
          container.innerHTML += `
            <div class="match">
              <div class="match-header">${g.date}</div>
              <div class="match-body">
                <span><b>${g.home}</b></span>
                <div class="score-box">
                  <input type="number" min="0" value="${g.hScore}" onchange="updateScore(${g.id}, 'h', this.value)">
                  <span>x</span>
                  <input type="number" min="0" value="${g.aScore}" onchange="updateScore(${g.id}, 'a', this.value)">
                </div>
                <span><b>${g.away}</b></span>
              </div>
            </div>`;
        }
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-agenda').className = tab === 'agenda' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-sim').className = tab === 'simulador' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('sim-actions').style.display = tab === 'simulador' ? 'flex' : 'none';
      renderMatches();
    }

    function updateScore(id, side, val) {
      const g = roundGames.find(item => item.id === id);
      if (g) {
        if (side === 'h') g.hScore = val;
