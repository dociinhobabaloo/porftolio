<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Dashboard & Simulador Interativo</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --g4: #10b981;
      --g6: #06b6d4;
      --z4: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at top, rgba(16, 185, 129, 0.08), transparent 50%);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 640px) { body { padding: 20px; } }

    header {
      max-width: 1240px;
      width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        margin-bottom: 24px;
      }
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo-img {
      width: 44px; height: 44px; object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5));
    }

    .brand-title h1 { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .brand-title p { font-size: 0.7rem; color: var(--text-muted); }

    @media (min-width: 640px) {
      .brand-title h1 { font-size: 1.1rem; }
      .brand-title p { font-size: 0.75rem; }
    }

    .audio-player-box {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      padding: 6px 12px; border-radius: 12px;
      width: 100%; justify-content: space-between;
    }

    @media (min-width: 640px) { .audio-player-box { width: auto; } }

    .audio-player-box span { font-size: 0.75rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    audio { height: 32px; max-width: 200px; outline: none; }

    .container { 
      display: flex; flex-direction: column; gap: 16px; 
      max-width: 1240px; margin: 0 auto; width: 100%;
    }

    @media (min-width: 960px) {
      .container { display: grid; grid-template-columns: 1fr 360px; gap: 20px; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
    }

    @media (min-width: 640px) { .card { padding: 18px; } }

    .table-tools {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
    }

    @media (min-width: 640px) {
      .table-tools { flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    }

    .search-input {
      background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
      color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; outline: none; width: 100%;
    }
    @media (min-width: 640px) { .search-input { width: 220px; padding: 8px 14px; } }
    .search-input:focus { border-color: var(--accent); }

    .legend { display: flex; gap: 10px; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 580px; }
    th {
      color: var(--text-muted); padding: 10px 6px; text-align: center;
      border-bottom: 1px solid var(--card-border); font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    }
    th.left, td.left { text-align: left; }
    td { padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.03); }

    .club-cell { display: flex; align-items: center; gap: 10px; }
    .club-badge-svg {
      width: 22px; height: 22px; flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    tr.g4 td:first-child { border-left: 4px solid var(--g4); }
    tr.g6 td:first-child { border-left: 4px solid var(--g6); }
    tr.z4 td:first-child { border-left: 4px solid var(--z4); }

    .pts { font-weight: 800; color: var(--accent); background: rgba(16, 185, 129, 0.08); border-radius: 6px; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .panel-header h2 { font-size: 0.85rem; font-weight: 800; }
    
    .round-select {
      background: #000; color: var(--accent); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 6px 8px; font-size: 0.72rem; font-weight: bold; outline: none; cursor: pointer;
    }

    .tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 10px; border: 1px solid var(--card-border); margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 10px 6px; border: none; background: transparent;
      color: var(--text-muted); font-weight: 700; cursor: pointer; border-radius: 8px; font-size: 0.75rem; transition: 0.2s;
    }
    .tab-btn.active { background: var(--card-bg); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    .matches-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
    .match-item { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; }
    .match-date { font-size: 0.65rem; color: var(--accent); text-align: center; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; }
    .match-teams { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; }
    .team-col { flex: 1; display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .team-col.home { justify-content: flex-end; }
    .team-col.away { justify-content: flex-start; }
    .team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .score-inputs { display: flex; align-items: center; gap: 4px; }
    .score-inputs input {
      width: 32px; height: 32px; background: #000; border: 1px solid var(--card-border);
      border-radius: 6px; color: var(--accent); text-align: center; font-weight: bold; font-size: 0.85rem; outline: none;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; pt-3; border-top: 1px solid var(--card-border); }
    .btn { flex: 1; padding: 12px 8px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .btn-confirm { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .btn-confirm:hover { background: var(--accent-hover); }
    .btn-reset { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border); }
    .btn-reset:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="logo-brasileirao.png" alt="Logo Brasileirão" class="brand-logo-img" onerror="this.style.display='none'">
      <div class="brand-title">
        <h1>BRASILEIRÃO SÉRIE A</h1>
        <p>Classificação Oficial, Agenda & Simulador</p>
      </div>
    </div>

    <div class="audio-player-box">
      <span>♫ Tema</span>
      <audio id="audio-fundo" controls loop preload="auto">
        <source src="musica-brasileirao.mp3" type="audio/mpeg">
        O seu navegador não suporta o áudio.
      </audio>
    </div>
  </header>

  <div class="container">
    
    <div class="card">
      <div class="table-tools">
        <input type="text" id="search-input" class="search-input" onkeyup="filterTable()" placeholder="Buscar time...">
        <div class="legend">
          <div class="legend-item"><div class="dot" style="background: var(--g4)"></div> G4</div>
          <div class="legend-item"><div class="dot" style="background: var(--g6)"></div> G6</div>
          <div class="legend-item"><div class="dot" style="background: var(--z4)"></div> Z4</div>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Clube</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="panel-header">
        <h2 id="panel-title">Próximos Jogos</h2>
        <select id="round-select" class="round-select" onchange="renderMatches()">
          <option value="29">Rodada 29 (Esta Semana)</option>
          <option value="30">Rodada 30 (Próxima Semana)</option>
        </select>
      </div>

      <div class="tabs">
        <button id="tab-agenda" class="tab-btn active" onclick="switchTab('agenda')">📅 Agenda</button>
        <button id="tab-sim" class="tab-btn" onclick="switchTab('simulador')">⚡ Simulador</button>
      </div>

      <div id="matches-list" class="matches-list"></div>

      <div id="sim-actions" class="btn-group" style="display: none;">
        <button class="btn btn-confirm" onclick="confirmSimulation()">Confirmar Placares</button>
        <button class="btn btn-reset" onclick="resetSimulation()">Resetar</button>
      </div>
    </div>

  </div>
