<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão Série A - Dashboard & Simulador</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#17231c;
}
header{
  background:linear-gradient(135deg,#08783f,#07552f);
  color:#fff;
  padding:22px 16px;
  text-align:center;
}
header img{width:95px;max-width:30vw;height:auto}
header h1{margin:10px 0 5px;font-size:28px}
header p{margin:0;opacity:.9}
.container{max-width:1200px;margin:auto;padding:18px}
.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  padding:18px;
  margin-bottom:18px;
}
.card h2{margin:0 0 14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,button{
  border:1px solid #d7ded9;
  border-radius:10px;
  padding:11px 13px;
  font-size:15px;
}
input{flex:1;min-width:200px}
button{cursor:pointer;background:#08783f;color:#fff;border:0;font-weight:700}
button.secondary{background:#e9efeb;color:#17432c}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{
  background:#edf5ef;
  color:#17432c;
  text-align:center;
  padding:11px 8px;
  font-size:13px;
}
td{
  border-bottom:1px solid #edf0ee;
  padding:10px 7px;
  text-align:center;
  font-size:14px;
}
td.team{text-align:left;font-weight:700;white-space:nowrap}
.team img{
  width:34px;height:34px;object-fit:contain;
  vertical-align:middle;margin-right:9px;
}
.pos{font-weight:800}
.g4{border-left:4px solid #1686d9}
.g6{border-left:4px solid #8b55d9}
.z4{border-left:4px solid #d93636}
.match-day{margin-top:18px}
.match-day h3{
  margin:0 0 10px;
  padding:10px 12px;
  border-radius:10px;
  background:#edf5ef;
}
.match{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  padding:12px 8px;
  border-bottom:1px solid #edf0ee;
}
.match .home{text-align:right}
.match .away{text-align:left}
.match-team{font-weight:700}
.match-team img{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin:0 7px}
.time{font-size:13px;color:#66736b;text-align:center;min-width:95px}
.sim-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:12px;
}
.sim-card{
  border:1px solid #e1e7e3;
  border-radius:12px;
  padding:12px;
}
.sim-card strong{display:block;margin-bottom:8px}
.score-row{display:flex;gap:7px;align-items:center;justify-content:center}
.score-row input{width:70px;min-width:0;flex:none;text-align:center}
.badge{display:inline-block;padding:3px 7px;border-radius:20px;font-size:11px;font-weight:800;margin-left:7px}
.badge.g4{background:#dceeff;color:#12629b;border:0}
.badge.g6{background:#eee4ff;color:#6436a0;border:0}
.badge.z4{background:#ffe0e0;color:#a92121;border:0}
footer{text-align:center;padding:20px;color:#68736c;font-size:13px}

@media(max-width:700px){
  header{padding:16px 12px}
  header img{width:75px}
  header h1{font-size:22px}
  .container{padding:10px}
  .card{padding:12px;border-radius:12px}
  .card h2{font-size:19px}
  .controls{gap:7px}
  input,select,button{font-size:14px;padding:10px}
  table{min-width:700px}
  th,td{padding:8px 5px;font-size:12px}
  .team img{width:29px;height:29px;margin-right:6px}
  .match{grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:5px}
  .match-team{font-size:12px}
  .match-team img{width:24px;height:24px;margin:0 4px}
  .time{font-size:11px;min-width:70px}
}
</style>
</head>
<body>

<header>
  <img src="https://raw.githubusercontent.com/Lobobinho/Escudos-dos-Clubes-do-Brasileirao-2026/master/Brasileir%C3%A3o%20S%C3%A9rie%20A%20HD.png" alt="Logo Brasileirão">
  <h1>BRASILEIRÃO SÉRIE A</h1>
  <p>Classificação, Agenda & Simulador</p>
</header>

<main class="container">
<section class="card">
  <h2>Classificação</h2>
  <p>Brasileirão Série A · tabela de pontos</p>
  <div class="controls">
    <input id="search" type="text" placeholder="Buscar time...">
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</section>

<section class="card">
  <h2>Próximos Jogos</h2>
  <div class="controls">
    <select id="round-select">
      <option value="29">29ª rodada</option>
      <option value="30">30ª rodada</option>
    </select>
    <button id="agenda-btn">📅 Agenda</button>
    <button id="sim-btn">⚡ Simulador</button>
  </div>
  <div id="matches"></div>
</section>

<section class="card" id="simulator" style="display:none">
  <h2>Simulador</h2>
  <p>Digite os placares e veja a pontuação simulada.</p>
  <div id="sim-grid" class="sim-grid"></div>
  <div class="controls" style="margin-top:14px">
    <button id="confirm-btn">Confirmar Placares</button>
    <button id="reset-btn" class="secondary">Resetar</button>
  </div>
</section>
</main>

<footer>Brasileirão Série A · Dashboard</footer>

<script>
const BASE = "https://raw.githubusercontent.com/Lobobinho/Escudos-dos-Clubes-do-Brasileirao-2026/master/";

const clubs = [
{name:"Flamengo",pts:60,j:28,v:18,e:6,d:4,gp:55,gc:23,logo:"Flamengo.png"},
{name:"Palmeiras",pts:57,j:28,v:16,e:9,d:3,gp:47,gc:21,logo:"Palmeiras.png"},
{name:"Athletico-PR",pts:49,j:28,v:14,e:7,d:7,gp:43,gc:32,logo:"Athletico Paranaense.png"},
{name:"Fluminense",pts:48,j:28,v:13,e:9,d:6,gp:44,gc:36,logo:"Fluminense.png"},
{name:"Bahia",pts:46,j:28,v:12,e:10,d:6,gp:43,gc:35,logo:"Bahia.png"},
{name:"Cruzeiro",pts:45,j:28,v:13,e:6,d:9,gp:42,gc:40,logo:"Cruzeiro.png"},
{name:"Atlético-MG",pts:40,j:27,v:11,e:7,d:9,gp:36,gc:32,logo:"Atlético Mineiro.png"},
{name:"Santos",pts:38,j:27,v:10,e:8,d:9,gp:41,gc:40,logo:"Santos.png"},
{name:"Coritiba",pts:38,j:28,v:10,e:8,d:10,gp:37,gc:43,logo:"Coritiba.png"},
{name:"RB Bragantino",pts:36,j:27,v:10,e:6,d:11,gp:33,gc:31,logo:"Red Bull Bragantino.png"},
{name:"São Paulo",pts:36,j:27,v:10,e:6,d:11,gp:32,gc:30,logo:"São Paulo.png"},
{name:"Botafogo",pts:35,j:28,v:9,e:8,d:11,gp:41,gc:45,logo:"Botafogo.png"},
{name:"Vitória",pts:33,j:28,v:9,e:6,d:13,gp:28,gc:42,logo:"Vitória.png"},
{name:"Corinthians",pts:32,j:28,v:8,e:8,d:12,gp:29,gc:32,logo:"Corinthians.png"},
{name:"Mirassol",pts:32,j:28,v:8,e:8,d:12,gp:33,gc:42,logo:"Mirassol.png"},
{name:"Vasco da Gama",pts:31,j:27,v:8,e:7,d:12,gp:34,gc:41,logo:"Vasco da Gama.png"},
{name:"Grêmio",pts:29,j:28,v:7,e:8,d:13,gp:30,gc:38,logo:"Grêmio.png"},
{name:"Internacional",pts:28,j:28,v:6,e:10,d:12,gp:30,gc:36,logo:"Internacional.png"},
{name:"Remo",pts:23,j:28,v:5,e:8,d:15,gp:32,gc:47,logo:"Remo.png"},
{name:"Chapecoense",pts:18,j:27,v:3,e:9,d:15,gp:29,gc:53,logo:"Chapecoense.png"}
];

const games = {
29:[
["Bragantino","Mirassol","07/10","19:30"],
["Internacional","Corinthians","07/10","19:30"],
["Remo","Grêmio","07/10","19:30"],
["Vitória","Chapecoense","07/10","20:00"],
["Botafogo","Vasco da Gama","07/10","20:30"],
["Cruzeiro","São Paulo","07/10","21:30"],
["Santos","Flamengo","08/10","19:30"],
["Athletico-PR","Atlético-MG","08/10","20:00"],
["Fluminense","Coritiba","08/10","21:30"],
["Palmeiras","Bahia","08/10","21:30"]
],
30:[
["Vasco da Gama","Remo","10/10","17:00"],
["São Paulo","Vitória","10/10","21:00"],
["Atlético-MG","Santos","11/10","16:00"],
["Flamengo","Fluminense","11/10","17:30"],
["Palmeiras","Corinthians","11/10","17:30"],
["Grêmio","Internacional","11/10","17:30"],
["Coritiba","Botafogo","11/10","19:30"],
["Bahia","Mirassol","11/10","19:30"],
["Chapecoense","Athletico-PR","12/10","19:30"],
["Bragantino","Cruzeiro","12/10","21:00"]
]};

function findClub(name){
  return clubs.find(c=>c.name===name) || {
    name,logo:""
  };
}
function logoURL(club){
  return club.logo ? BASE + encodeURIComponent(club.logo) : "";
}
function badge(club){
  return club.logo
    ? `<img src="${logoURL(club)}" alt="${club.name}" loading="lazy" onerror="this.style.display='none'">`
    : "";
}

function renderTable(){
  const q = document.getElementById("search").value.toLowerCase().trim();
  const sorted=[...clubs].sort((a,b)=>
    b.pts-a.pts || (b.gp-b.gc)-(a.gp-a.gc) || b.v-a.v || a.name.localeCompare(b.name)
  );
  const body=document.getElementById("table-body");
  body.innerHTML="";
  sorted.filter(c=>c.name.toLowerCase().includes(q)).forEach((c,i)=>{
    const pos=i+1;
    const zone=pos<=4?"g4":pos<=6?"g6":pos>=17?"z4":"";
    const tr=document.createElement("tr");
    if(zone) tr.className=zone;
    tr.innerHTML=`
      <td class="pos">${pos}</td>
      <td class="team">${badge(c)}${c.name}
        ${pos<=4?'<span class="badge g4">G4</span>':pos<=6?'<span class="badge g6">G6</span>':pos>=17?'<span class="badge z4">Z4</span>':''}
      </td>
      <td><b>${c.pts}</b></td><td>${c.j}</td><td>${c.v}</td><td>${c.e}</td><td>${c.d}</td>
      <td>${c.gp}</td><td>${c.gc}</td><td>${c.gp-c.gc}</td>`;
    body.appendChild(tr);
  });
}

function renderMatches(){
  const round=document.getElementById("round-select").value;
  const box=document.getElementById("matches");
  box.innerHTML=`<div class="match-day"><h3>${round}ª rodada</h3></div>`;
  games[round].forEach((g,index)=>{
    const h=findClub(g[0]), a=findClub(g[1]);
    const div=document.createElement("div");
    div.className="match";
    div.innerHTML=`
      <div class="home match-team">${h.name} ${badge(h)}</div>
      <div class="time">${g[2]}<br><b>${g[3]}</b></div>
      <div class="away match-team">${badge(a)} ${a.name}</div>`;
    box.querySelector(".match-day").appendChild(div);
  });
}

function renderSimulator(){
  const round=document.getElementById("round-select").value;
  const grid=document.getElementById("sim-grid");
  grid.innerHTML="";
  games[round].forEach((g,i)=>{
    const div=document.createElement("div");
    div.className="sim-card";
    div.innerHTML=`
      <strong>${g[0]} x ${g[1]}</strong>
      <div class="score-row">
        <input type="number" min="0" value="0" id="home-${i}">
        <span>x</span>
        <input type="number" min="0" value="0" id="away-${i}">
      </div>`;
    grid.appendChild(div);
  });
}

document.addEventListener("DOMContentLoaded",()=>{
  renderTable();
  renderMatches();
  renderSimulator();

  document.getElementById("search").addEventListener("input",renderTable);
  document.getElementById("round-select").addEventListener("change",()=>{
    renderMatches();
    renderSimulator();
  });
  document.getElementById("agenda-btn").addEventListener("click",()=>{
    document.getElementById("simulator").style.display="none";
    document.getElementById("matches").scrollIntoView({behavior:"smooth"});
  });
  document.getElementById("sim-btn").addEventListener("click",()=>{
    document.getElementById("simulator").style.display="block";
    document.getElementById("simulator").scrollIntoView({behavior:"smooth"});
  });
  document.getElementById("reset-btn").addEventListener("click",renderSimulator);
  document.getElementById("confirm-btn").addEventListener("click",()=>{
    alert("Placares confirmados para a simulação!");
  });
});
</script>
</body>
</html>
