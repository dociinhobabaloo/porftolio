<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A - Dashboard & Simulador Interativo</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --g4: #10b981;
      --g6: #06b6d4;
      --z4: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at top, rgba(16, 185, 129, 0.08), transparent 50%);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 640px) { body { padding: 20px; } }

    header {
      max-width: 1240px;
      width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        margin-bottom: 24px;
      }
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    
    /* Logo Local do Ficheiro logo-brasileirao.png */
    .brand-logo-img {
      width: 44px; height: 44px; object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5));
    }

    .brand-title h1 { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .brand-title p { font-size: 0.7rem; color: var(--text-muted); }

    @media (min-width: 640px) {
      .brand-title h1 { font-size: 1.1rem; }
      .brand-title p { font-size: 0.75rem; }
    }

    .audio-player-box {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      padding: 6px 12px; border-radius: 12px;
      width: 100%; justify-content: space-between;
    }

    @media (min-width: 640px) { .audio-player-box { width: auto; } }

    .audio-player-box span { font-size: 0.75rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    audio { height: 32px; max-width: 200px; outline: none; }

    .container { 
      display: flex; flex-direction: column; gap: 16px; 
      max-width: 1240px; margin: 0 auto; width: 100%;
    }

    @media (min-width: 960px) {
      .container { display: grid; grid-template-columns: 1fr 360px; gap: 20px; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
    }

    @media (min-width: 640px) { .card { padding: 18px; } }

    .table-tools {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
    }

    @media (min-width: 640px) {
      .table-tools { flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    }

    .search-input {
      background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
      color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; outline: none; width: 100%;
    }
    @media (min-width: 640px) { .search-input { width: 220px; padding: 8px 14px; } }
    .search-input:focus { border-color: var(--accent); }

    .legend { display: flex; gap: 10px; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 580px; }
    th {
      color: var(--text-muted); padding: 10px 6px; text-align: center;
      border-bottom: 1px solid var(--card-border); font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    }
    th.left, td.left { text-align: left; }
    td { padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.03); }

    .club-cell { display: flex; align-items: center; gap: 10px; }
    .club-badge-img {
      width: 22px; height: 22px; object-fit: contain; flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    tr.g4 td:first-child { border-left: 4px solid var(--g4); }
    tr.g6 td:first-child { border-left: 4px solid var(--g6); }
    tr.z4 td:first-child { border-left: 4px solid var(--z4); }

    .pts { font-weight: 800; color: var(--accent); background: rgba(16, 185, 129, 0.08); border-radius: 6px; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .panel-header h2 { font-size: 0.85rem; font-weight: 800; }
    
    .round-select {
      background: #000; color: var(--accent); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 6px 8px; font-size: 0.72rem; font-weight: bold; outline: none; cursor: pointer;
    }

    .tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 10px; border: 1px solid var(--card-border); margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 10px 6px; border: none; background: transparent;
      color: var(--text-muted); font-weight: 700; cursor: pointer; border-radius: 8px; font-size: 0.75rem; transition: 0.2s;
    }
    .tab-btn.active { background: var(--card-bg); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    .matches-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
    .match-item { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; }
    .match-date { font-size: 0.65rem; color: var(--accent); text-align: center; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; }
    .match-teams { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; }
    .team-col { flex: 1; display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .team-col.home { justify-content: flex-end; }
    .team-col.away { justify-content: flex-start; }
    .team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .score-inputs { display: flex; align-items: center; gap: 4px; }
    .score-inputs input {
      width: 32px; height: 32px; background: #000; border: 1px solid var(--card-border);
      border-radius: 6px; color: var(--accent); text-align: center; font-weight: bold; font-size: 0.85rem; outline: none;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; pt-3; border-top: 1px solid var(--card-border); }
    .btn { flex: 1; padding: 12px 8px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .btn-confirm { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .btn-confirm:hover { background: var(--accent-hover); }
    .btn-reset { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border); }
    .btn-reset:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <!-- Apontando para o ficheiro logo-brasileirao.png do teu repositorio -->
      <img src="logo-brasileirao.png" alt="Logo Brasileirão" class="brand-logo-img">
      <div class="brand-title">
        <h1>BRASILEIRÃO SÉRIE A</h1>
        <p>Classificação Oficial, Agenda & Simulador</p>
      </div>
    </div>

    <div class="audio-player-box">
      <span>♫ Tema</span>
      <audio id="audio-fundo" controls loop preload="auto">
        <source src="musica-brasileirao.mp3" type="audio/mpeg">
        O seu navegador não suporta o áudio.
      </audio>
    </div>
  </header>

  <div class="container">
    
    <div class="card">
      <div class="table-tools">
        <input type="text" id="search-input" class="search-input" onkeyup="filterTable()" placeholder="Buscar time...">
        <div class="legend">
          <div class="legend-item"><div class="dot" style="background: var(--g4)"></div> G4</div>
          <div class="legend-item"><div class="dot" style="background: var(--g6)"></div> G6</div>
          <div class="legend-item"><div class="dot" style="background: var(--z4)"></div> Z4</div>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Clube</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="panel-header">
        <h2 id="panel-title">Próximos Jogos</h2>
        <select id="round-select" class="round-select" onchange="renderMatches()">
          <option value="29">Rodada 29 (Esta Semana)</option>
          <option value="30">Rodada 30 (Próxima Semana)</option>
        </select>
      </div>

      <div class="tabs">
        <button id="tab-agenda" class="tab-btn active" onclick="switchTab('agenda')">📅 Agenda</button>
        <button id="tab-sim" class="tab-btn" onclick="switchTab('simulador')">⚡ Simulador</button>
      </div>

      <div id="matches-list" class="matches-list"></div>

      <div id="sim-actions" class="btn-group" style="display: none;">
        <button class="btn btn-confirm" onclick="confirmSimulation()">Confirmar Placares</button>
        <button class="btn btn-reset" onclick="resetSimulation()">Resetar</button>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('click', function() {
      const audio = document.getElementById('audio-fundo');
      if (audio && audio.paused) {
        audio.play().catch(() => {});
      }
    }, { once: true });

    // Escudos Oficiais
    const teamBadges = {
      'Flamengo': 'https://api.sofascore.app/api/v1/team/5981/image',
      'Palmeiras': 'https://api.sofascore.app/api/v1/team/1963/image',
      'Athletico-PR': 'https://api.sofascore.app/api/v1/team/1960/image',
      'Fluminense': 'https://api.sofascore.app/api/v1/team/1961/image',
      'Bahia': 'https://api.sofascore.app/api/v1/team/1955/image',
      'Cruzeiro': 'https://api.sofascore.app/api/v1/team/1954/image',
      'Atlético-MG': 'https://api.sofascore.app/api/v1/team/1977/image',
      'Santos': 'https://api.sofascore.app/api/v1/team/1964/image',
      'Coritiba': 'https://api.sofascore.app/api/v1/team/1982/image',
      'São Paulo': 'https://api.sofascore.app/api/v1/team/1981/image',
      'Red Bull Bragantino': 'https://api.sofascore.app/api/v1/team/1999/image',
      'Botafogo': 'https://api.sofascore.app/api/v1/team/1958/image',
      'Vitória': 'https://api.sofascore.app/api/v1/team/1968/image',
      'Corinthians': 'https://api.sofascore.app/api/v1/team/1957/image',
      'Mirassol': 'https://api.sofascore.app/api/v1/team/32014/image',
      'Vasco da Gama': 'https://api.sofascore.app/api/v1/team/1974/image',
      'Grêmio': 'https://api.sofascore.app/api/v1/team/1959/image',
      'Internacional': 'https://api.sofascore.app/api/v1/team/1966/image',
      'Remo': 'https://api.sofascore.app/api/v1/team/2000/image',
      'Chapecoense': 'https://api.sofascore.app/api/v1/team/32281/image'
    };

    function getBadgeHtml(teamName) {
      const src = teamBadges[teamName] || '';
      return `<img src="${src}" alt="${teamName}" class="club-badge-img" onerror="this.style.display='none'">`;
    }

    const initialTeams = [
      { name: 'Flamengo', pts: 60, j: 28, v: 18, e: 6, d: 4, gp: 55, gc: 23 },
      { name: 'Palmeiras', pts: 57, j: 28, v: 16, e: 9, d: 3, gp: 47, gc: 21 },
      { name: 'Athletico-PR', pts: 49, j: 28, v: 14, e: 7, d: 7, gp: 43, gc: 32 },
      { name: 'Fluminense', pts: 48, j: 28, v: 13, e: 9, d: 6, gp: 44, gc: 36 },
      { name: 'Bahia', pts: 46, j: 28, v: 12, e: 10, d: 6, gp: 43, gc: 35 },
      { name: 'Cruzeiro', pts: 45, j: 28, v: 13, e: 6, d: 9, gp: 42, gc: 40 },
      { name: 'Atlético-MG', pts: 43, j: 28, v: 12, e: 7, d: 9, gp: 37, gc: 32 },
      { name: 'Santos', pts: 41, j: 28, v: 11, e: 8, d: 9, gp: 43, gc: 41 },
      { name: 'Coritiba', pts: 38, j: 28, v: 10, e: 8, d: 10, gp: 37, gc: 43 },
      { name: 'São Paulo', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Red Bull Bragantino', pts: 36, j: 28, v: 10, e: 6, d: 12, gp: 33, gc: 32 },
      { name: 'Botafogo', pts: 35, j: 28, v: 9, e: 8, d: 11, gp: 41, gc: 45 },
      { name: 'Vitória', pts: 33, j: 28, v: 9, e: 6, d: 13, gp: 28, gc: 42 },
      { name: 'Corinthians', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 29, gc: 32 },
      { name: 'Mirassol', pts: 32, j: 28, v: 8, e: 8, d: 12, gp: 33, gc: 42 },
      { name: 'Vasco da Gama', pts: 31, j: 27, v: 8, e: 7, d: 12, gp: 34, gc: 41 },
      { name: 'Grêmio', pts: 29, j: 28, v: 7, e: 8, d: 13, gp: 30, gc: 38 },
      { name: 'Internacional', pts: 28, j: 28, v: 6, e: 10, d: 12, gp: 30, gc: 36 },
      { name: 'Remo', pts: 23, j: 28, v: 5, e: 8, d: 15, gp: 32, gc: 47 },
      { name: 'Chapecoense', pts: 18, j: 27, v: 3, e: 9, d: 15, gp: 29, gc: 53 }
    ];

    const round29 = [
      { id: 1, home: 'Remo', away: 'Grêmio', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 2, home: 'Red Bull Bragantino', away: 'Mirassol', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 3, home: 'Internacional', away: 'Corinthians', date: 'Qua • 07/10 - 19:30', hScore: '', aScore: '' },
      { id: 4, home: 'Vitória', away: 'Chapecoense', date: 'Qua • 07/10 - 20:00', hScore: '', aScore: '' },
      { id: 5, home: 'Botafogo', away: 'Vasco da Gama', date: 'Qua • 07/10 - 20:30', hScore: '', aScore: '' },
      { id: 6, home: 'Cruzeiro', away: 'São Paulo', date: 'Qua • 07/10 - 21:30', hScore: '', aScore: '' },
      { id: 7, home: 'Santos', away: 'Flamengo', date: 'Qui • 08/10 - 19:30', hScore: '', aScore: '' },
      { id: 8, home: 'Athletico-PR', away: 'Atlético-MG', date: 'Qui • 08/10 - 20:00', hScore: '', aScore: '' },
      { id: 9, home: 'Fluminense', away: 'Coritiba', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' },
      { id: 10, home: 'Palmeiras', away: 'Bahia', date: 'Qui • 08/10 - 21:30', hScore: '', aScore: '' }
    ];

    const round30 = [
      { id: 11, home: 'Vasco da Gama', away: 'Remo', date: 'Sáb • 10/10 - 18:00', hScore: '', aScore: '' },
      { id: 12, home: 'São Paulo', away: 'Vitória', date: 'Sáb • 10/10 - 21:00', hScore: '', aScore: '' },
      { id: 13, home: 'Atlético-MG', away: 'Santos', date: 'Dom • 11/10 - 16:00', hScore: '', aScore: '' },
      { id: 14, home: 'Flamengo', away: 'Fluminense', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 15, home: 'Palmeiras', away: 'Corinthians', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 16, home: 'Grêmio', away: 'Internacional', date: 'Dom • 11/10 - 17:30', hScore: '', aScore: '' },
      { id: 17, home: 'Bahia', away: 'Mirassol', date: 'Dom • 11/10 - 19:30', hScore: '', aScore: '' },
      { id: 18, home: 'Coritiba', away: 'Botafogo', date: 'Seg • 12/10 - 16:00', hScore: '', aScore: '' },
      { id: 19, home: 'Chapecoense', away: 'Athletico-PR', date: 'Seg • 12/10 - 19:30', hScore: '', aScore: '' },
      { id: 20, home: 'Red Bull Bragantino', away: 'Cruzeiro', date: 'Seg • 12/10 - 21:00', hScore: '', aScore: '' }
    ];

    let activeTeams = JSON.parse(JSON.stringify(initialTeams));
    let activeTab = 'agenda';

    function renderTable() {
      activeTeams.sort((a, b) => (b.pts - a.pts) || (b.v - a.v) || ((b.gp - b.gc) - (a.gp - a.gc)));
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      
      activeTeams.forEach((t, index) => {
        const pos = index + 1;
        const sg = t.gp - t.gc;
        let zoneClass = pos <= 4 ? 'g4' : (pos <= 6 ? 'g6' : (pos >= 17 ? 'z4' : ''));

        tbody.innerHTML += `
          <tr class="${zoneClass}">
            <td>${pos}</td>
            <td class="left">
              <div class="club-cell">
                ${getBadgeHtml(t.name)}
                <span>${t.name}</span>
              </div>
            </td>
            <td class="pts">${t.pts}</td>
            <td>${t.j}</td>
            <td>${t.v}</td>
            <td>${t.e}</td>
            <td>${t.d}</td>
            <td>${t.gp}</td>
            <td>${t.gc}</td>
            <td>${sg > 0 ? '+' + sg : sg}</td>
          </tr>
        `;
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-agenda').className = tab === 'agenda' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-sim').className = tab === 'simulador' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('sim-actions').style.display = tab === 'simulador' ? 'flex' : 'none';
      document.getElementById('panel-title').textContent = tab === 'agenda' ? 'Próximos Jogos' : 'Simulador';
      renderMatches();
    }

    function renderMatches() {
      const selectedRound = document.getElementById('round-select').value;
      const games = selectedRound === '29' ? round29 : round30;
      const container = document.getElementById('matches-list');
      container.innerHTML = '';

      games.forEach(g => {
        if (activeTab === 'agenda') {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-teams">
                <div class="team-col home">
                  <span class="team-name">${g.home}</span>
                  ${getBadgeHtml(g.home)}
                </div>
                <span style="color: var(--text-muted); font-size: 0.7rem; padding: 0 6px;">VS</span>
                <div class="team-col away">
                  ${getBadgeHtml(g.away)}
                  <span class="team-name">${g.away}</span>
                </div>
              </div>
            </div>`;
        } else {
          container.innerHTML += `
            <div class="match-item">
              <div class="match-date">${g.date}</div>
              <div class="match-teams">
                <div class="team-col home">
                  <span class="team-name">${g.home}</span>
                  ${getBadgeHtml(g.home)}
                </div>
                <div class="score-inputs">
                  <input type="number" min="0" value="${g.hScore}" onchange="updateScore(${g.id}, 'h', this.value)">
                  <span style="color: var(--text-muted); font-size: 0.7rem;">x</span>
                  <input type="number" min="0" value="${g.aScore}" onchange="updateScore(${g.id}, 'a', this.value)">
                </div>
                <div class="team-col away">
                  ${getBadgeHtml(g.away)}
                  <span class="team-name">${g.away}</span>
                </div>
              </div>
            </div>`;
        }
      });
    }

    function updateScore(id, side, val) {
      const allGames = [...round29, ...round30];
      const game = allGames.find(g => g.id === id);
      if (game) {
        if (side === 'h') game.hScore = val;
        else game.aScore = val;
      }
    }

    function confirmSimulation() {
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      const allGames = [...round29, ...round30];

      allGames.forEach(g => {
        if (g.hScore !== '' && g.aScore !== '') {
          const h = parseInt(g.hScore);
          const a = parseInt(g.aScore);
          const home = activeTeams.find(t => t.name === g.home);
          const away = activeTeams.find(t => t.name === g.away);

          if (home && away) {
            home.j++; away.j++; home.gp += h; home.gc += a; away.gp += a; away.gc += h;
            if (h > a) { home.pts += 3; home.v++; away.d++; }
            else if (a > h) { away.pts += 3; away.v++; home.d++; }
            else { home.pts++; away.pts++; home.e++; away.e++; }
          }
        }
      });

      renderTable();
    }

    function resetSimulation() {
      [...round29, ...round30].forEach(g => { g.hScore = ''; g.aScore = ''; });
      activeTeams = JSON.parse(JSON.stringify(initialTeams));
      renderMatches();
      renderTable();
    }

    function filterTable() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#table-body tr');

      rows.forEach(row => {
        const teamName = row.children[1].textContent.toLowerCase();
        row.style.display = teamName.includes(query) ? '' : 'none';
      });
    }

    renderTable();
    renderMatches();
  </script>
</body>
</html>
