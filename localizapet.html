
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Localiza Pet - Vila Velha</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            background-image: url('img/animais.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #0f172a;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* BOTÃO VOLTAR */

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;

            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;

            font-size: 13px;
            font-weight: 500;

            border: 1px solid rgba(255, 255, 255, 0.4);

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;

            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;

            white-space: nowrap;
        }

        .btn-voltar:hover {
            background: #e11d48;
            border-color: #e11d48;
            transform: translateY(-2px);
        }

        .btn-voltar:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }

        /* TABLETS */

        @media (max-width: 768px) {
            body {
                background-position: center center;
            }

            .btn-voltar {
                top: 16px;
                left: 16px;
                padding: 10px 17px;
                font-size: 13px;
            }
        }

        /* CELULARES */

        @media (max-width: 480px) {
            body {
                background-size: cover;
                background-position: center center;
            }

            .btn-voltar {
                top: 12px;
                left: 12px;

                padding: 10px 15px;
                font-size: 12px;

                background: rgba(0, 0, 0, 0.78);
                border-radius: 25px;
            }
        }

        /* CELULARES MENORES */

        @media (max-width: 360px) {
            .btn-voltar {
                top: 10px;
                left: 10px;
                padding: 9px 13px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-voltar {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="btn-voltar">
        ← Voltar ao Portfólio
    </a>

</body>
</html>
